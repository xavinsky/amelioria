# Un exemple = le run.py d'un dossier de méthode ou d'une de ses variantes.
# Résultats : configuration complète sur le matériel de référence, mesures de septembre 2026.
# duree_test / duree_complet : durée mesurée du test rapide et de l'exemple complet sur ce matériel.
# fait : ce que fait l'exemple, en une phrase ; piste : pour un exemple non prouvé, ce qui le rendrait démontré.
exemples:
  - chemin: 01-pre-entrainement-continu
    statut: non-prouve
    fait: "Poursuit l'entraînement de Qwen2.5-0.5B sur les fiches de 40 personnages inventés, avec du texte général contre l'oubli, puis l'interroge sur eux."
    piste: "Suivre le protocole de *Physics of Language Models 3.1* : mélanger fiches et questions-réponses pendant l'entraînement, puis mesurer l'extraction sur des personnages jamais questionnés."
    duree_test: "12 s"
    duree_complet: "56 s"
    resultat: "perplexité domaine 130 → 9,5 ; générale 20,2 → 22,6 ; questions sur les faits 0 → 0,04"
    reserve: la connaissance apprise n'est pas extractable par question
    prerequis: {gpu: requis}
  - chemin: 01-pre-entrainement-continu/variantes/mlm-encodeur
    statut: demontre
    fait: "Poursuit le pré-entraînement par masquage de mots d'un encodeur RoBERTa sur un texte de domaine."
    duree_test: "8 s"
    duree_complet: "17 s"
    resultat: "perte MLM 2,38 → 1,09"
    reserve: sans intervalle de confiance
    prerequis: {gpu: conseille}

  - chemin: 02-fine-tuning-supervise
    statut: demontre
    fait: "Fine-tuning complet de Qwen2.5-0.5B-Instruct pour router des messages de clients bancaires vers 77 intentions (banking77), avec remélange contre l'oubli."
    duree_test: "21 s"
    duree_complet: "29 min"
    resultat: "intentions 0,231 → 0,904 (n = 3 080) ; non-régression 0,955 → 0,765 (0,025 sans remélange)"
    reserve: oubli partiel malgré le remélange
    prerequis: {gpu: requis}
  - chemin: 02-fine-tuning-supervise/variantes/classification-encodeur
    statut: demontre
    fait: "Entraîne ModernBERT-base à classer les mêmes messages bancaires en 77 intentions (banking77)."
    duree_test: "10 s"
    duree_complet: "2 min"
    resultat: "intentions 0,012 → 0,937 (n = 3 080), 85 s d'entraînement"
    prerequis: {gpu: conseille}
  - chemin: 02-fine-tuning-supervise/variantes/vision
    statut: demontre
    fait: "Entraîne un ViT à classer des photos en 10 catégories (CIFAR-10)."
    duree_test: "13 s"
    duree_complet: "84 s"
    resultat: "CIFAR-10 0,10 → 0,97"
    prerequis: {gpu: conseille}
  - chemin: 02-fine-tuning-supervise/variantes/seq2seq
    statut: non-prouve
    fait: "Fine-tune FLAN-T5 (encodeur-décodeur) sur des problèmes d'arithmétique."
    piste: "Une tâche naturellement seq2seq, traduction ou résumé de domaine, mesurée en chrF ou ROUGE."
    duree_test: "10 s"
    duree_complet: "57 s"
    resultat: "exactitude 0 → 0,22"
    reserve: l'arithmétique est inadaptée au découpage des nombres de T5
    prerequis: {gpu: conseille}
  - chemin: 02-fine-tuning-supervise/variantes/audio-whisper
    statut: non-prouve
    fait: "Fine-tune Whisper-small pour transcrire de la parole (taux d'erreur sur les mots)."
    piste: "Un jeu audio où Whisper se trompe nettement : vocabulaire spécialisé, accent, bruit téléphonique."
    duree_test: "32 s"
    duree_complet: "9 min"
    resultat: "WER 0,141 → 0,141"
    reserve: le modèle est déjà bon sur ce jeu
    prerequis: {gpu: conseille, extras: [torchcodec]}

  - chemin: 03-peft
    statut: demontre
    fait: "Entraîne un adaptateur LoRA sur Qwen2.5-0.5B-Instruct, mêmes données que le fine-tuning complet (banking77, remélange compris), pour comparer gain et oubli."
    duree_test: "23 s"
    duree_complet: "32 min"
    resultat: "intentions 0,229 → 0,891 (n = 3 080) ; non-régression 0,955 → 0,95 ; adaptateur désactivé 0,955"
    prerequis: {gpu: requis, extras_selon: {peft.methode=qlora: [bitsandbytes]}}
  - chemin: 03-peft/variantes/diffusion-lora
    statut: non-prouve
    fait: "Apprend un nouveau sujet à Stable Diffusion à partir de quelques images (DreamBooth-LoRA)."
    piste: "Une mesure chiffrée : similarité DINO ou CLIP entre les images générées et le sujet, avant et après."
    duree_test: "20 s"
    duree_complet: "74 s"
    resultat: sujet appris à l'inspection visuelle des images
    reserve: aucune mesure chiffrée
    prerequis: {gpu: requis, extras: [diffusers]}

  - chemin: 04-optimisation-preferences
    statut: non-prouve
    fait: "DPO sur des paires « raisonnement juste / raisonnement avec une erreur de calcul »."
    piste: "De vraies préférences (UltraFeedback, HelpSteer), un taux de victoire mesuré par un modèle de récompense externe, et un contrôle de non-régression."
    duree_test: "23 s"
    duree_complet: "4 min"
    resultat: "génération 0,955 → 0,985 ; marge de préférence 0,40 → 0,91"
    reserve: préférences artificielles, gain proche de l'intervalle de confiance
    prerequis: {gpu: requis}
  - chemin: 04-optimisation-preferences/variantes/dpo-iteratif
    statut: non-prouve
    fait: "DPO en plusieurs tours : le modèle génère ses propres paires, triées par un vérificateur."
    piste: "Même refonte que l'exemple principal, sur de vraies préférences."
    duree_test: "14 s"
    duree_complet: "21 min"
    resultat: "0,955 → 0,98"
    reserve: préférences artificielles, gain proche de l'intervalle de confiance
    prerequis: {gpu: requis}

  - chemin: 05-rl-en-ligne
    statut: non-prouve
    fait: "RL (DAPO) avec récompense vérifiable : le modèle est récompensé quand son calcul est juste."
    piste: "GSM8K, la tâche des papiers de référence, sur ses 1 319 questions de test, avec un modèle qui y échoue souvent."
    duree_test: "21 s"
    duree_complet: "13 min"
    resultat: "exactitude 0,955 → 0,945 ; récompense 0,66 → 0,84"
    reserve: tâche arithmétique déjà résolue par le modèle de départ
    prerequis: {gpu: requis, api: true}
  - chemin: 05-rl-en-ligne/variantes/modele-recompense
    statut: demontre
    fait: "Entraîne un modèle de récompense à préférer la bonne réponse dans des paires."
    duree_test: "13 s"
    duree_complet: "87 s"
    resultat: "exactitude de préférence 0,485 → 0,98"
    prerequis: {gpu: requis}

  - chemin: 06-distillation
    statut: non-prouve
    fait: "Distille Qwen2.5-1.5B (enseignant) vers Qwen2.5-0.5B (élève) en imitant ses probabilités."
    piste: "GSM8K avec un enseignant nettement meilleur que l'élève, mode séquence puis logits ; comprendre la régression mesurée."
    duree_test: "16 s"
    duree_complet: "3 min"
    resultat: "élève 0,955 → 0,71 ; enseignant 0,995"
    reserve: tâche déjà résolue par l'élève ; régression à comprendre
    prerequis: {gpu: requis}
  - chemin: 06-distillation/variantes/encodeur-classification
    statut: demontre
    fait: "Distille un classifieur de sentiment RoBERTa vers un BERT 10 fois plus petit."
    duree_test: "25 s"
    duree_complet: "78 s"
    resultat: "sans enseignant 0,758 ; distillé 0,839"
    prerequis: {gpu: conseille}

  - chemin: 07-donnees-synthetiques
    statut: non-prouve
    fait: "Le modèle génère plusieurs solutions, un vérificateur garde les justes, et il s'entraîne dessus (rejection sampling)."
    piste: "GSM8K, sur lequel le modèle échoue souvent : rejection sampling fine-tuning (RFT, STaR)."
    duree_test: "21 s"
    duree_complet: "19 min"
    resultat: "0,955 → 0,89 → 0,90"
    reserve: tâche arithmétique déjà résolue par le modèle de départ
    prerequis: {gpu: requis}

  - chemin: 08-fusion-modeles
    statut: demontre
    fait: "Fusionne Qwen2.5-1.5B-Instruct dans sa base par DARE-TIES, sur CPU, sans données."
    duree_test: "21 s"
    duree_complet: "3 min"
    resultat: "GSM8K : base 0,07 ; Instruct 0,51 ; fusion DARE-TIES 0,55"
    reserve: "démontre le mécanisme (n = 100) ; scénario multi-compétences à faire"
    prerequis: {gpu: conseille}

  - chemin: 09-edition-connaissances
    statut: demontre
    fait: "Modifie 4 faits réels dans les poids par ROME (la tour Eiffel « passe » à Rome...)."
    duree_test: "12 s"
    duree_complet: "48 s"
    resultat: "efficacité 0 → 1 ; généralisation 0 → 1 ; spécificité 1 → 1"
    reserve: "n = 4 faits"
    prerequis: {gpu: requis}

  - chemin: 10-desapprentissage
    statut: demontre
    fait: "Fait oublier 4 personnages appris par NPO, en gardant les 36 autres."
    duree_test: "20 s"
    duree_complet: "59 s"
    resultat: "oubli 1,0 → 0,0 ; rétention 1,0 → 0,925 ; perplexité 25,8 → 26,6"
    prerequis: {gpu: requis}

  - chemin: 11-pilotage-activations
    statut: demontre
    fait: "Rend les réponses plus positives en ajoutant une direction d'activations pendant la génération."
    duree_test: "12 s"
    duree_complet: "27 s"
    resultat: "taux de réponses positives 0,60 → 0,97"
    reserve: "n = 30 par condition"
    prerequis: {gpu: requis}

  - chemin: 12-extension-contexte
    statut: demontre
    fait: "Fait passer SmolLM-360M de 2 048 à 8 192 tokens de contexte par YaRN et un court entraînement."
    duree_test: "15 s"
    duree_complet: "33 min"
    resultat: "perplexité à 8 192 tokens 422 → 19 ; clé retrouvée à 7 000 tokens 0,3 → 1,0"
    reserve: "n = 10 clés"
    prerequis: {gpu: requis}

  - chemin: 13-extension-vocabulaire
    statut: non-prouve
    fait: "Ajoute 200 tokens pour des noms mal découpés, les initialise et les entraîne ; compare à un témoin sans nouveaux tokens."
    piste: "Un corpus réel mal découpé (langue peu couverte), en mesurant aussi le débit de génération ; le témoin à budget égal existe déjà."
    duree_test: "16 s"
    duree_complet: "41 s"
    resultat: "tokens du corpus −22 % ; bits par caractère 1,92 → 0,42 ; témoin sans nouveaux tokens 0,41"
    reserve: l'entraînement explique la baisse des bits par caractère ; le gain propre est la compression, à qualité presque égale, sur une seule graine
    prerequis: {gpu: requis}

  - chemin: 14-croissance-architecture
    statut: non-prouve
    fait: "Agrandit SmolLM2-360M de 32 à 48 couches (SOLAR) puis le réentraîne ; compare au modèle d'origine entraîné pareil."
    piste: "La croissance LLaMA Pro (blocs ajoutés, l'original est préservé) et un budget de cicatrisation plus grand, toujours comparés au témoin."
    duree_test: "13 s"
    duree_complet: "24 min"
    resultat: "perplexité 19,9 → 26,9 (transformé) → 14,9 (cicatrisé) ; témoin sans croissance 14,3"
    reserve: à entraînement égal, le modèle d'origine fait mieux que le modèle agrandi ; la croissance demande un budget de cicatrisation bien plus grand
    prerequis: {gpu: requis}

  - chemin: 15-quantification
    statut: demontre
    fait: "Quantifie Qwen2.5-1.5B-Instruct en 4 bits (NF4) et mesure la perte de qualité, la mémoire et la vitesse."
    duree_test: "15 s"
    duree_complet: "50 s"
    resultat: "NF4 : 2 945 → 1 132 Mo ; perplexité 14,9 → 16,6 ; exactitude 0,99 → 0,96"
    prerequis:
      gpu: requis
      extras: [bitsandbytes, torchao]
      extras_selon: {methode=gptq: [llmcompressor], methode=awq: [llmcompressor]}
  - chemin: 15-quantification/variantes/gguf-llamacpp
    statut: demontre
    fait: "Exporte le modèle en GGUF pour llama.cpp, du 16 bits au 3 bits, et compare taille et perplexité."
    duree_test: "15 s"
    duree_complet: "21 min"
    resultat: "Q4_K_M : 940 Mo ; perplexité 13,9 → 14,5"
    prerequis: {gpu: facultatif, outils: [llamacpp]}

