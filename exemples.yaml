# Catalogue des exemples : catégories, statut, résultat mesuré et prérequis.
# Source unique lue par `make liste`, `make verifier`, le README et le site AmeliorIA.
#
# Statuts :
#   demontre    le gain est mesuré et net sur le besoin visé (les réserves éventuelles sont indiquées)
#   non-prouve  l'exemple s'exécute, mais son résultat ne démontre pas encore le gain de la méthode
#   non-teste   le code existe mais n'a pas été exécuté (versions grosse infra des dossiers `infra/`)
#
# Prérequis :
#   extras        modules Python hors socle (`make install EXTRAS=1`)
#   extras_selon  modules requis seulement pour certaines valeurs de config (clé=valeur passée par SET)
#   outils        llamacpp : clone compilé de llama.cpp ; llmcompressor : venv `make install-gptq`
#   gpu           requis (CUDA indispensable) | conseille (CPU possible mais lent) | facultatif
#   api           true : le modèle peut être servi par une API compatible OpenAI (API=..., MODELE=...)

materiel_reference: RTX 5070 Ti Laptop (12 Go, 11,5 Gio utilisables), 30 Go de RAM

statuts:
  demontre: Démontré
  non-prouve: Non prouvé
  non-teste: Non testé

# Coût typique d'une méthode, en ordre de grandeur, pour un modèle de 7 à 8 milliards de paramètres
# sur un cas d'usage réel (pas l'exemple réduit du dépôt). `calcul` et `duree` de chaque méthode.
couts:
  hypothese: ordre de grandeur pour un modèle de 7 à 8 milliards de paramètres, sur un cas d'usage réel
  calcul:
    0: CPU ou API
    1: 1 GPU (inférence)
    2: 1 GPU (entraînement)
    3: plusieurs GPU
  duree:
    1: minutes
    2: heures
    3: jours

# Contraintes d'une méthode : `acces` au modèle, `donnees` à fournir, et `remelange: true` quand il faut
# mélanger des données générales aux siennes pour limiter l'oubli (champs de chaque méthode).
contraintes:
  acces:
    ouvert: poids nécessaires
    ferme: fermé (API) possible
  donnees:
    aucune: aucune donnée
    texte: texte brut, documents
    annotees: exemples annotés
    preferences: préférences A > B
    verificateur: réponses vérifiables
  remelange: remélanger du général

# code : 4 lettres lisibles en anglais comme en français ; une méthode est désignée par le code de sa
# catégorie suivi de son numéro (SIGN05), accepté aussi par EX= dans les commandes make.
# infra (chaque méthode) : ce que fait la version grosse infra, le matériel visé et une durée estimée, jamais mesurée.
categories:
  - id: donnees
    code: DATA
    titre: Apprendre à partir de données
    resume: Entraîner les poids sur des exemples, texte brut ou paires question/réponse.
  - id: signal
    code: SIGN
    titre: Apprendre à partir d'un signal
    resume: Apprendre d'un jugement, d'une récompense, d'un enseignant ou de ses propres sorties filtrées.
  - id: chirurgie
    code: EDIT
    titre: Chirurgie du modèle
    resume: Combiner des modèles, corriger, effacer ou orienter un savoir ou un comportement précis.
  - id: remodeler
    code: FORM
    titre: "Remodeler : étendre ou compresser"
    resume: Changer la forme du modèle (fenêtre de contexte, vocabulaire, couches, précision, taille).
  - id: inference
    code: EXEC
    titre: "À l'exécution, sans toucher aux poids"
    resume: Améliorer le résultat autour du modèle ; fonctionne aussi avec un modèle fermé via API.

methodes:
  - dossier: 01-pre-entrainement-continu
    titre: Pré-entraînement continu
    court: "Pré-entraînement"
    categorie: donnees
    infra: {fait: "Pré-entraînement continu de Llama-3.1-8B sur environ 2 milliards de tokens.", materiel: "8×H100", duree_estimee: "9 à 12 h"}
    regroupe: "Continued pretraining, DAPT, adaptation à une langue, MLM continu"
    modeles: "LLM de base ; encodeurs (variante MLM) ; seq2seq, vision, audio (même principe)"
    local: "⚠️ ≤ 1,5B · ☁️"
    calcul: 3
    duree: 3
    acces: ouvert
    donnees: texte
    remelange: true
  - dossier: 02-fine-tuning-supervise
