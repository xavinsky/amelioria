# Catalogue des exemples : catégories, statut, résultat mesuré et prérequis.
# Source unique lue par `make liste`, `make verifier`, le README et le site AmeliorIA.
#
# Statuts :
#   demontre    le gain est mesuré et net sur le besoin visé (les réserves éventuelles sont indiquées)
#   non-prouve  l'exemple s'exécute, mais son résultat ne démontre pas encore le gain de la méthode
#   non-teste   le code existe mais n'a pas été exécuté (versions grosse infra des dossiers `infra/`)
#
# Prérequis :
#   extras        modules Python hors socle (`make install EXTRAS=1`)
#   extras_selon  modules requis seulement pour certaines valeurs de config (clé=valeur passée par SET)
#   outils        llamacpp : clone compilé de llama.cpp ; llmcompressor : venv `make install-gptq`
#   gpu           requis (CUDA indispensable) | conseille (CPU possible mais lent) | facultatif
#   api           true : le modèle peut être servi par une API compatible OpenAI (API=..., MODELE=...)

materiel_reference: RTX 5070 Ti Laptop (12 Go, 11,5 Gio utilisables), 30 Go de RAM

statuts:
  demontre: Démontré
  non-prouve: Non prouvé
  non-teste: Non testé

# Coût typique d'une méthode, en ordre de grandeur, pour un modèle de 7 à 8 milliards de paramètres
# sur un cas d'usage réel (pas l'exemple réduit du dépôt). `calcul` et `duree` de chaque méthode.
couts:
  hypothese: ordre de grandeur pour un modèle de 7 à 8 milliards de paramètres, sur un cas d'usage réel
  calcul:
    0: CPU ou API
    1: 1 GPU (inférence)
    2: 1 GPU (entraînement)
    3: plusieurs GPU
  duree:
    1: minutes
    2: heures
    3: jours

# Contraintes d'une méthode : `acces` au modèle, `donnees` à fournir, et `remelange: true` quand il faut
# mélanger des données générales aux siennes pour limiter l'oubli (champs de chaque méthode).
contraintes:
  acces:
    ouvert: poids nécessaires
    ferme: fermé (API) possible
  donnees:
    aucune: aucune donnée
    texte: texte brut, documents
    annotees: exemples annotés
    preferences: préférences A > B
    verificateur: réponses vérifiables
  remelange: remélanger du général

categories:
  - id: donnees
    titre: Apprendre à partir de données
    resume: Entraîner les poids sur des exemples, texte brut ou paires question/réponse.
  - id: signal
    titre: Apprendre à partir d'un signal
    resume: Apprendre d'un jugement, d'une récompense, d'un enseignant ou de ses propres sorties filtrées.
  - id: chirurgie
    titre: Chirurgie du modèle
    resume: Combiner des modèles, corriger, effacer ou orienter un savoir ou un comportement précis.
  - id: remodeler
    titre: "Remodeler : étendre ou compresser"
    resume: Changer la forme du modèle (fenêtre de contexte, vocabulaire, couches, précision, taille).
  - id: inference
    titre: Sans toucher aux poids
    resume: Améliorer le résultat autour du modèle ; fonctionne aussi avec un modèle fermé via API.

methodes:
  - dossier: 01-pre-entrainement-continu
    titre: Pré-entraînement continu
    court: "Pré-entraînement"
    categorie: donnees
    regroupe: "Continued pretraining, DAPT, adaptation à une langue, MLM continu"
    modeles: "LLM de base ; encodeurs (variante MLM) ; seq2seq, vision, audio (même principe)"
    local: "⚠️ ≤ 1,5B · ☁️"
    calcul: 3
    duree: 3
    acces: ouvert
    donnees: texte
    remelange: true
  - dossier: 02-fine-tuning-supervise
    titre: Fine-tuning supervisé
    court: "SFT"
    categorie: donnees
    regroupe: "SFT, instruction tuning, fine-tuning complet"
    modeles: "LLM ; variantes : encodeur (classification), vision (ViT), seq2seq (T5), speech (Whisper)"
    local: "⚠️ ≤ 1B (LLM), ✅ autres"
    calcul: 3
    duree: 2
    acces: ouvert
    donnees: annotees
    remelange: true
  - dossier: 03-peft
    titre: "PEFT (LoRA, QLoRA...)"
    court: "LoRA, QLoRA"
    categorie: donnees
    regroupe: "LoRA, QLoRA, DoRA, rsLoRA, PiSSA, LoHa, LoKr, IA³, prompt et prefix tuning"
    modeles: "Tous (couches linéaires) ; variante : diffusion (DreamBooth-LoRA)"
    local: "✅ ≤ 3B (LoRA), ≤ 8B (QLoRA)"
    calcul: 2
    duree: 2
    acces: ouvert
    donnees: annotees
  - dossier: 04-optimisation-preferences
    titre: Optimisation des préférences
    court: "DPO"
    categorie: signal
    regroupe: "DPO, IPO, rDPO, SLiC, APO, NCA, BCO, SPPO, ORPO, SimPO, CPO, KTO ; variante DPO itératif"
    modeles: "LLM (après SFT), VLM, diffusion (Diffusion-DPO)"
    local: "⚠️ ≤ 0,5B complet, ≤ 3B LoRA"
    calcul: 2
    duree: 2
    acces: ouvert
    donnees: preferences
  - dossier: 05-rl-en-ligne
    titre: RL en ligne
    court: "RL"
    categorie: signal
    regroupe: "RLHF, RLAIF, RLVR ; GRPO, Dr.GRPO, DAPO, GSPO, CISPO, RLOO ; PPO en infra ; variante modèle de récompense"
    modeles: "LLM, VLM, agents ; diffusion (DDPO)"
    local: "⚠️ ≤ 1,5B · ☁️"
    calcul: 3
    duree: 3
    acces: ouvert
    donnees: verificateur
  - dossier: 06-distillation
    titre: Distillation
    court: "Distillation"
    categorie: signal
    regroupe: "Logits (KD), séquences, on-policy (GKD) ; variante classifieur encodeur"
    modeles: "LLM (même tokenizer pour logits), encodeurs, vision, diffusion"
    local: "✅ petits couples · ☁️ 70B → 8B"
    calcul: 3
    duree: 3
    acces: ouvert
    donnees: texte
  - dossier: 07-donnees-synthetiques
    titre: Données synthétiques
    court: "Données synth."
    categorie: signal
    regroupe: "Rejection sampling (RFT/STaR), Self-Instruct, critique-révision (Constitutional AI)"
    modeles: "LLM ; données pour classifieurs, VLM, diffusion"
    local: "✅ ≤ 1B"
    calcul: 2
    duree: 2
    acces: ouvert
    donnees: verificateur
  - dossier: 08-fusion-modeles
    titre: Fusion de modèles
    court: "Fusion"
    categorie: chirurgie
    regroupe: "Model soups, SLERP, task arithmetic, TIES, DARE ; mergekit, fusion évolutionnaire"
    modeles: "Fine-tunes d'une même base : LLM, LoRA, CLIP/ViT, diffusion"
    local: "✅ CPU/RAM"
    calcul: 0
    duree: 1
    acces: ouvert
    donnees: aucune
  - dossier: 09-edition-connaissances
    titre: Édition de connaissances
    court: "Édition"
    categorie: chirurgie
    regroupe: "ROME, FT-L ; MEMIT, AlphaEdit en infra"
    modeles: "LLM décodeurs ; diffusion (UCE, TIME)"
    local: "✅ ≤ 3B"
    calcul: 1
    duree: 1
    acces: ouvert
    donnees: annotees
  - dossier: 10-desapprentissage
    titre: Désapprentissage
    court: "Désapprentissage"
    categorie: chirurgie
    regroupe: "Gradient ascent, gradient difference, NPO, IDK ; TOFU, open-unlearning"
    modeles: "LLM ; classifieurs ; diffusion (ESD)"
    local: "✅ ≤ 1B"
    calcul: 2
    duree: 1
    acces: ouvert
    donnees: texte
    remelange: true
  - dossier: 11-pilotage-activations
    titre: Pilotage par activations
    court: "Pilotage"
    categorie: chirurgie
    regroupe: "Steering vectors (ActAdd, CAA), abliteration"
    modeles: "LLM décodeurs (tout flux résiduel) ; diffusion (concept sliders)"
    local: "✅ ≤ 7B"
    calcul: 1
    duree: 1
    acces: ouvert
    donnees: preferences
  - dossier: 12-extension-contexte
    titre: Extension de contexte
    court: "Contexte"
    categorie: remodeler
    regroupe: "Position Interpolation, NTK dynamique, YaRN, ABF"
    modeles: "LLM à RoPE ; VLM (M-RoPE) ; encodeurs RoPE"
    local: "⚠️ petits modèles, 8k · ☁️"
    calcul: 3
    duree: 2
    acces: ouvert
    donnees: texte
    remelange: true
  - dossier: 13-extension-vocabulaire
    titre: Extension de vocabulaire
    court: "Vocabulaire"
    categorie: remodeler
    regroupe: "Added tokens, fusion BPE, init par moyenne, entraînement en 2 phases"
    modeles: "LLM, encodeurs, seq2seq, tokens spéciaux VLM"
    local: "✅ ≤ 1B"
    calcul: 3
    duree: 3
    acces: ouvert
    donnees: texte
    remelange: true
  - dossier: 14-croissance-architecture
    titre: Croissance d'architecture
    court: "Croissance"
    categorie: remodeler
