# Un exemple = le run.py d'un dossier de méthode ou d'une de ses variantes.
# Résultats : configuration complète sur le matériel de référence, mesures de septembre 2026.
# duree_test / duree_complet : durée mesurée du test rapide et de l'exemple complet sur ce matériel.
# fait : ce que fait l'exemple, en une phrase ; piste : pour un exemple non prouvé, ce qui le rendrait démontré.
exemples:
  - chemin: 01-pre-entrainement-continu
    statut: demontre
    fait: "Poursuit l'entraînement de Qwen2.5-0.5B sur les biographies de 400 personnages inventés et les questions-réponses de la moitié d'entre eux (protocole *Physics of Language Models 3.1*), puis l'interroge sur l'autre moitié, 3 graines."
    duree_complet: "25 min"
    resultat: "questions sur les personnages jamais questionnés 0,001 → 0,9996 ± 0,0007 ; témoin à une biographie 0,997"
    reserve: "perplexité générale 20,2 → 24,2 malgré le replay ; la diversité des formulations n'apporte presque rien sur un modèle pré-entraîné"
    prerequis: {gpu: requis}
  - chemin: 01-pre-entrainement-continu/variantes/mlm-encodeur
    statut: non-prouve
    fait: "Poursuit le pré-entraînement par masquage de mots d'un encodeur RoBERTa sur un texte de domaine."
    piste: "Protocole de *Don't Stop Pretraining* sur banking77 : masquage continu sur les messages sans étiquettes, puis classification avec 10 exemples par intention, contre le même fine-tuning sans masquage, 3 graines."
    duree_test: "8 s"
    duree_complet: "17 s"
    resultat: "perte MLM 2,38 → 1,09"
    reserve: "aucune tâche finale mesurée : la perte montre seulement que le modèle complète des fiches au même format"
    prerequis: {gpu: conseille}

  - chemin: 02-fine-tuning-supervise
    statut: demontre
    fait: "Fine-tuning complet de Qwen2.5-0.5B-Instruct pour router des messages de clients bancaires vers 77 intentions (banking77), avec remélange contre l'oubli."
    duree_test: "21 s"
    duree_complet: "29 min"
    resultat: "intentions 0,231 → 0,904 (n = 3 080) ; non-régression 0,955 → 0,765 (0,025 sans remélange)"
    reserve: oubli partiel malgré le remélange
    prerequis: {gpu: requis}
  - chemin: 02-fine-tuning-supervise/variantes/classification-encodeur
    statut: demontre
    fait: "Entraîne ModernBERT-base à classer les mêmes messages bancaires en 77 intentions (banking77)."
    duree_test: "10 s"
    duree_complet: "2 min"
    resultat: "intentions 0,012 → 0,937 (n = 3 080), 85 s d'entraînement"
    prerequis: {gpu: conseille}
  - chemin: 02-fine-tuning-supervise/variantes/vision
    statut: demontre
    fait: "Entraîne un ViT à classer des photos en 10 catégories (CIFAR-10)."
    duree_test: "13 s"
    duree_complet: "84 s"
    resultat: "CIFAR-10 0,10 → 0,97"
    prerequis: {gpu: conseille}
  - chemin: 02-fine-tuning-supervise/variantes/seq2seq
    statut: demontre
    fait: "Fine-tune Flan-T5-base (encodeur-décodeur) pour résumer des dialogues de service client (DialogSum)."
    duree_test: "10 s"
    duree_complet: "30 min"
    resultat: "ROUGE-L 0,291 → 0,432 (+0,141 [+0,127 ; +0,156], n = 500)"
    reserve: ROUGE-L mesure le recouvrement de mots, pas l'exactitude des faits
    prerequis: {gpu: conseille}
  - chemin: 02-fine-tuning-supervise/variantes/audio-whisper
    statut: demontre
    fait: "Fine-tune Whisper-small sur des conversations en anglais de 40 accents (EdAcc), mesure sur d'autres locuteurs, 3 graines."
    duree_test: "32 s"
    duree_complet: "15 min"
    resultat: "WER 0,232 → 0,181 (−0,051 ± 0,004, 3 graines)"
    reserve: "anglais lu (LibriSpeech) 0,034 → 0,041 ; décodage de référence de Whisper nécessaire contre les boucles de répétition"
    prerequis: {gpu: conseille, extras: [torchcodec]}

  - chemin: 03-peft
    statut: demontre
    fait: "Entraîne un adaptateur LoRA sur Qwen2.5-0.5B-Instruct, mêmes données que le fine-tuning complet (banking77, remélange compris), pour comparer gain et oubli."
    duree_test: "23 s"
    duree_complet: "32 min"
    resultat: "intentions 0,229 → 0,891 (n = 3 080) ; non-régression 0,955 → 0,95 ; adaptateur désactivé 0,955"
    prerequis: {gpu: requis, extras_selon: {peft.methode=qlora: [bitsandbytes]}}
  - chemin: 03-peft/variantes/diffusion-lora
    statut: demontre
    fait: "Apprend un chien précis à Stable Diffusion 1.5 à partir de 5 photos (DreamBooth-LoRA), mesuré comme dans le papier DreamBooth : similarité DINO au sujet et CLIP au prompt, 4 prompts × 8 graines appariés avant/après."
    duree_test: "20 s"
    duree_complet: "8 min"
    resultat: "fidélité au sujet (DINO) 0,281 → 0,751 (p < 0,001) ; fidélité au prompt (CLIP) 0,300 → 0,293 (n.s.)"
    reserve: "un seul sujet, références de mesure = photos d'entraînement ; pose et fond des photos souvent recopiés"
    prerequis: {gpu: requis, extras: [diffusers]}

  - chemin: 04-optimisation-preferences
    statut: non-prouve
    fait: "DPO LoRA de Qwen2.5-0.5B-Instruct sur 16 000 paires UltraFeedback ; un modèle de récompense externe compare ses réponses à celles du modèle de départ ; témoin SFT sur les réponses préférées."
    piste: "Partir d'un modèle non aligné (base + SFT) où la marge est plus grande, ou passer au DPO itératif sur les réponses du modèle lui-même."
    duree_test: "1 min"
    duree_complet: "2 h"
    resultat: "victoires contre le départ 0,533 ± 0,032 sur 3 graines (0,552 ; 0,496 ; 0,550) ; témoin SFT 0,380 ; non-régression 0,955 → 0,963"
    reserve: "gain net sur 2 graines sur 3 ; faible sur un modèle déjà aligné par ses auteurs"
    prerequis: {gpu: requis}
  - chemin: 04-optimisation-preferences/variantes/dpo-iteratif
    statut: non-prouve
    fait: "Trois tours de DPO LoRA sur des paires que Qwen2.5-0.5B-Instruct produit lui-même (4 réponses à 500 demandes UltraFeedback, classées par Skywork-Reward-V2 0,6B) ; mesure par un autre juge (Skywork-Reward-V2 1,7B)."
    piste: "Confirmer sur 2 graines."
    duree_complet: "1 h 40"
    resultat: "victoires contre le départ 0,532 → 0,602 → 0,616 [0,573 ; 0,658] au fil des tours ; non-régression 0,955 → 0,935 (n.s.)"
    reserve: "une graine ; juges de la même famille"
    prerequis: {gpu: requis}

  - chemin: 05-rl-en-ligne
    statut: demontre
    fait: "RL (DAPO) sur 800 problèmes de GSM8K : le modèle est récompensé quand sa réponse finale est juste, sans solution rédigée."
    duree_test: "21 s"
    duree_complet: "1 h 05"
    resultat: "GSM8K (n = 1 319) : 0,411 → 0,465 (p = 0,0002) ; non-régression 0,955 → 0,955"
    prerequis: {gpu: requis, api: true}
  - chemin: 05-rl-en-ligne/variantes/modele-recompense
    statut: demontre
    fait: "Entraîne un modèle de récompense à préférer la bonne réponse dans des paires."
    duree_test: "13 s"
    duree_complet: "87 s"
    resultat: "exactitude de préférence 0,485 → 0,98"
    prerequis: {gpu: requis}

  - chemin: 06-distillation
    statut: demontre
    fait: "Qwen2.5-3B-Instruct résout des problèmes de GSM8K ; Qwen2.5-0.5B-Instruct est entraîné sur ses solutions justes. Témoin : même entraînement sur les solutions humaines du jeu."
    duree_test: "16 s"
    duree_complet: "1 h 30"
    resultat: "GSM8K (n = 1 319) : élève 0,411 → 0,451 ; témoin solutions humaines 0,302 ; enseignant 0,760"
    reserve: gain modeste, l'élève reste loin de l'enseignant
    prerequis: {gpu: requis}
  - chemin: 06-distillation/variantes/encodeur-classification
    statut: demontre
    fait: "Distille un classifieur de sentiment RoBERTa vers un BERT 10 fois plus petit."
    duree_test: "25 s"
    duree_complet: "78 s"
    resultat: "sans enseignant 0,758 ; distillé 0,839"
    prerequis: {gpu: conseille}

  - chemin: 07-donnees-synthetiques
    statut: non-prouve
    fait: "Qwen2.5-0.5B de base, amorcé par 4 exemples, résout 3 000 problèmes de GSM8K 8 fois chacun et garde au plus 4 solutions justes aux calculs distincts par question (RFT, ReST-EM) ; pour les questions ratées, il rédige un raisonnement à partir de la réponse attendue en indice (STaR). Une époque de SFT ; témoin sur les solutions humaines."
    piste: "Remesurer sur 3 graines avec l'arrêt de la génération à la fin de la ligne « Answer: »."
    duree_test: "30 s"
    resultat: "une graine : GSM8K (n = 1 319) 0,363 → 0,402 (p = 0,004) ; témoin solutions humaines 0,332. Depuis le modèle instruct : 0,411 → 0,393 (n.s.)"
    reserve: "mesure à refaire : texte parasite après la réponse dans les solutions et la mesure de départ"
    prerequis: {gpu: requis}

  - chemin: 08-fusion-modeles
    statut: demontre
    fait: "Fusionne Qwen2.5-1.5B-Instruct dans sa base par DARE-TIES, sur CPU, sans données."
    duree_test: "21 s"
    duree_complet: "3 min"
    resultat: "GSM8K : base 0,07 ; Instruct 0,51 ; fusion DARE-TIES 0,55"
    reserve: "démontre le mécanisme (n = 100) ; scénario multi-compétences à faire"
    prerequis: {gpu: conseille}

  - chemin: 09-edition-connaissances
    statut: demontre
    fait: "Modifie 4 faits réels dans les poids par ROME (la tour Eiffel « passe » à Rome...)."
    duree_test: "12 s"
    duree_complet: "48 s"
    resultat: "efficacité 0 → 1 ; généralisation 0 → 1 ; spécificité 1 → 1"
    reserve: "n = 4 faits"
    prerequis: {gpu: requis}

  - chemin: 10-desapprentissage
    statut: demontre
    fait: "Fait oublier 4 personnages appris par NPO, en gardant les 36 autres."
    duree_test: "20 s"
    duree_complet: "59 s"
    resultat: "oubli 1,0 → 0,0 ; rétention 1,0 → 0,925 ; perplexité 25,8 → 26,6"
    prerequis: {gpu: requis}

  - chemin: 11-pilotage-activations
    statut: demontre
    fait: "Rend les réponses plus positives en ajoutant une direction d'activations pendant la génération."
    duree_test: "12 s"
    duree_complet: "27 s"
    resultat: "taux de réponses positives 0,60 → 0,97"
    reserve: "n = 30 par condition"
    prerequis: {gpu: requis}

  - chemin: 12-extension-contexte
    statut: demontre
    fait: "Fait passer SmolLM-360M de 2 048 à 8 192 tokens de contexte par YaRN et un court entraînement."
    duree_test: "15 s"
    duree_complet: "33 min"
    resultat: "perplexité à 8 192 tokens 422 → 19 ; clé retrouvée à 7 000 tokens 0,3 → 1,0"
    reserve: "n = 10 clés"
    prerequis: {gpu: requis}

  - chemin: 13-extension-vocabulaire
    statut: demontre
    fait: "Ajoute 1 000 mots bretons au tokenizer de Qwen2.5-0.5B, les initialise et les entraîne sur la Wikipédia en breton ; compare à un témoin sans nouveaux tokens, sur 3 graines."
    duree_test: "23 s"
    duree_complet: "13 min"
    resultat: "tokens du texte breton −15,8 % (2,48 → 2,94 caractères par token, 3 graines) ; bits par caractère 1,602 contre 1,572 pour le témoin"
    reserve: "à entraînement égal, qualité 2 % sous le témoin"
    prerequis: {gpu: requis}

  - chemin: 14-croissance-architecture
    statut: demontre
    fait: "Ajoute 8 couches neutres à SmolLM2-360M (LLaMA Pro) et n'entraîne qu'elles sur la Wikipédia en breton ; compare au modèle d'origine entraîné en entier, sur 3 graines."
    duree_test: "13 s"
    duree_complet: "55 min"
    resultat: "breton 145,6 → 10,9 ; anglais 19,9 → 22,0 ; témoin au même niveau en breton : anglais 23,6 (écart 1,57 ± 0,21, 3 graines)"
    reserve: "LLaMA Pro met 4 fois plus de pas pour atteindre ce niveau en breton et garde 22 % de paramètres en plus"
    prerequis: {gpu: requis}

  - chemin: 15-quantification
    statut: demontre
    fait: "Quantifie Qwen2.5-1.5B-Instruct en 4 bits (NF4) et mesure la perte de qualité, la mémoire et la vitesse."
    duree_test: "15 s"
    duree_complet: "50 s"
    resultat: "NF4 : 2 945 → 1 132 Mo ; perplexité 14,9 → 16,6 ; exactitude 0,99 → 0,96"
    prerequis:
      gpu: requis
      extras: [bitsandbytes, torchao]
      extras_selon: {methode=gptq: [llmcompressor], methode=awq: [llmcompressor]}
  - chemin: 15-quantification/variantes/gguf-llamacpp
    statut: demontre
    fait: "Exporte le modèle en GGUF pour llama.cpp, du 16 bits au 3 bits, et compare taille et perplexité."
    duree_test: "15 s"
    duree_complet: "21 min"
    resultat: "Q4_K_M : 940 Mo ; perplexité 13,9 → 14,5"
    prerequis: {gpu: facultatif, outils: [llamacpp]}

  - chemin: 16-elagage
    statut: non-prouve
    fait: "Met à zéro 50 % des poids de Qwen2.5-0.5B-Instruct (Wanda), puis récupère la qualité par distillation sur Wikipédia et sur des conversations du modèle d'origine."
    piste: "Un modèle bien plus grand (7-8B) avec un budget de cicatrisation de plusieurs milliards de tokens, sur grosse infra."
    duree_test: "21 s"
    duree_complet: "20 min"
    resultat: "tâche 0,88 → 0,34 → 0,66 (Wanda 50 %) ; 2:4 : 0,38 ; structuré : largeur 0,14, couches 0,09"
    reserve: "à 0,5B et 1 000 pas de cicatrisation, l'élagage ne paie pas : la tâche ne revient pas"
    prerequis: {gpu: requis}

  - chemin: 17-optimisation-prompt
    statut: demontre
    fait: "Compare des stratégies de prompt (consigne, consigne optimisée par OPRO, exemples au hasard, exemples les plus proches) pour router des messages bancaires vers 77 intentions, sans entraînement."
    duree_test: "18 s"
    duree_complet: "8 min"
    resultat: "intentions : zéro-shot 0,229 ; consigne OPRO 0,263 ; 8 exemples au hasard 0,312 ; 8 exemples les plus proches 0,816 (n = 3 080)"
    reserve: "le vote des 8 exemples les plus proches, sans LLM, fait mieux (0,920)"
    prerequis: {gpu: conseille, api: true}

  - chemin: 18-rag
    statut: demontre
    fait: "Répond à des questions sur 50 personnages inventés en cherchant les bons passages parmi 2 200."
    duree_test: "14 s"
    duree_complet: "54 s"
    resultat: "exactitude 0 → 1,0 ; rappel@3 = 1,0"
    prerequis: {gpu: conseille, api: true}

  - chemin: 19-outils-agents
    statut: demontre
    fait: "Donne au modèle une calculatrice et une base de fiches qu'il appelle pour répondre."
    duree_test: "10 s"
    duree_complet: "2 min"
    resultat: "0,35 → 0,95"
    prerequis: {gpu: conseille, api: true}

  - chemin: 20-calcul-inference
    statut: demontre
    fait: "Génère 16 réponses par question GSM8K et garde la plus fréquente ou la mieux notée."
    duree_test: "9 s"
    duree_complet: "10 min"
    resultat: "glouton 0,65 ; vote sur 16 réponses 0,77 ; oracle 0,93"
    prerequis: {gpu: conseille, api: true}
