    duree_complet: "25 min"
    resultat: "GSM8K (n = 250), Wanda 50 % sans cicatrisation : 12 % de l'exactitude conservée à 0,5B (0,432 → 0,052), 29 % à 1,5B (0,640 → 0,188), 87 % à 7B (0,824 → 0,720) ; 2:4 : 2 %, 3 % et 61 %"
