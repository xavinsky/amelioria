# Un exemple = le run.py d'un dossier de méthode ou d'une de ses variantes.
# Résultats : configuration complète sur le matériel de référence, mesures de septembre 2026.
# duree_test / duree_complet : durée mesurée du test rapide et de l'exemple complet sur ce matériel.
# fait : ce que fait l'exemple, en une phrase ; piste : pour un exemple non prouvé, ce qui le rendrait démontré.
exemples:
  - chemin: 01-pre-entrainement-continu
    statut: demontre
    tentatives: 1
    fait: "Poursuit l'entraînement de Qwen2.5-0.5B sur les biographies de 400 personnages inventés et les questions-réponses de la moitié d'entre eux (protocole *Physics of Language Models 3.1*), puis l'interroge sur l'autre moitié, 3 graines."
    duree_complet: "25 min"
    resultat: "questions sur les personnages jamais questionnés 0,001 → 0,9996 ± 0,0007 ; témoin à une biographie 0,997"
    reserve: "perplexité générale 20,2 → 24,2 malgré le replay ; la diversité des formulations n'apporte presque rien sur un modèle pré-entraîné"
    prerequis: {gpu: requis}
  - chemin: 01-pre-entrainement-continu/variantes/mlm-encodeur
    statut: demontre
    fait: "Poursuit le pré-entraînement par masquage de RoBERTa-base sur 10 003 messages bancaires sans étiquettes, puis le fine-tune à classer 77 intentions avec 5 messages étiquetés par intention, contre le même fine-tuning sans masquage, 3 graines."
    duree_test: "30 s"
    duree_complet: "10 min"
    resultat: "5 messages étiquetés par intention, 3 080 messages de test : 0,754 ± 0,020 sans masquage, 0,797 ± 0,014 avec ; écart apparié +0,043 (de +0,038 à +0,052), intervalle à 95 % qui exclut 0 sur chaque graine. À 10 par intention : +0,016 ± 0,011, net sur 2 graines sur 3"
    reserve: "l'avantage se voit quand les étiquettes sont rares (5 par intention) ; à 10 par intention il est plus faible et non net sur une graine"
    prerequis: {gpu: conseille}
  - chemin: 02-fine-tuning-supervise
    statut: demontre
    fait: "Fine-tuning complet de Qwen2.5-0.5B-Instruct pour router des messages de clients bancaires vers 77 intentions (banking77), avec remélange contre l'oubli."
    duree_test: "21 s"
    duree_complet: "29 min"
    resultat: "intentions 0,231 → 0,904 (n = 3 080) ; non-régression 0,955 → 0,765 (0,025 sans remélange)"
    reserve: oubli partiel malgré le remélange
    prerequis: {gpu: requis}
  - chemin: 02-fine-tuning-supervise/variantes/classification-encodeur
    statut: demontre
    fait: "Entraîne ModernBERT-base à classer les mêmes messages bancaires en 77 intentions (banking77)."
    duree_test: "10 s"
    duree_complet: "2 min"
    resultat: "intentions 0,015 → 0,937 ± 0,001 (n = 3 080) ; régression logistique TF-IDF 0,894 : +0,043, net sur 3 graines ; 85 s d'entraînement"
    reserve: "le fine-tuning ne dépasse la base TF-IDF que de 4 points"
    prerequis: {gpu: conseille}
  - chemin: 02-fine-tuning-supervise/variantes/vision
    statut: demontre
    fait: "Entraîne un ViT à classer des images satellite en 10 types de terrain (EuroSAT), jeu éloigné du pré-entraînement ; CIFAR-10 en contraste, 3 graines."
    duree_test: "13 s"
    duree_complet: "84 s"
    resultat: "EuroSAT (n = 2 700) : sonde linéaire sur plongements figés 0,946 ± 0,001 ; fine-tuning 0,987 ± 0,001 (+0,041, p de McNemar < 10⁻³ sur chaque graine). CIFAR-10 : 0,963 contre 0,972, non net"
    reserve: "sur un jeu proche du pré-entraînement (CIFAR-10) le fine-tuning ne dépasse pas nettement la sonde linéaire ; l'avantage se voit sur un jeu éloigné"
    prerequis: {gpu: conseille}
  - chemin: 02-fine-tuning-supervise/variantes/seq2seq
    statut: demontre
    fait: "Fine-tune Flan-T5-base (encodeur-décodeur) pour résumer des dialogues de service client (DialogSum), 3 graines."
    duree_test: "10 s"
    duree_complet: "22 min"
    resultat: "ROUGE-L 0,291 → 0,432 ± 0,002 ; fidélité (probabilité d'implication par un modèle d'inférence textuelle) 0,601 → 0,738 ± 0,019 ; gains appariés sur 500 dialogues dont l'intervalle exclut 0 sur chaque graine"
    reserve: "la fidélité est estimée par un modèle d'inférence textuelle (cross-encoder/nli-deberta-v3-base), pas par une relecture humaine ; les résumés sont plus longs après fine-tuning (14,5 → 23,6 mots)"
    prerequis: {gpu: conseille}
  - chemin: 02-fine-tuning-supervise/variantes/audio-whisper
    statut: demontre
    fait: "Fine-tune Whisper-small sur des conversations en anglais de 40 accents (EdAcc), mesure sur d'autres locuteurs, 3 graines."
    duree_test: "32 s"
    duree_complet: "15 min"
    resultat: "WER 0,232 → 0,181 (−0,051 ± 0,004, 3 graines)"
    reserve: "anglais lu (LibriSpeech) 0,034 → 0,041 ; décodage de référence de Whisper nécessaire contre les boucles de répétition"
    prerequis: {gpu: conseille, extras: [torchcodec]}

  - chemin: 03-peft
    statut: demontre
    fait: "Entraîne un adaptateur LoRA sur Qwen2.5-0.5B-Instruct, mêmes données que le fine-tuning complet (banking77, remélange compris), pour comparer gain et oubli."
    duree_test: "23 s"
    duree_complet: "32 min"
    resultat: "intentions 0,229 → 0,891 (n = 3 080) ; non-régression 0,955 → 0,95 ; adaptateur désactivé 0,955"
    prerequis: {gpu: requis, extras_selon: {peft.methode=qlora: [bitsandbytes]}}
  - chemin: 03-peft/variantes/diffusion-lora
    statut: demontre
    fait: "Apprend un chien précis à Stable Diffusion 1.5 à partir de 5 photos (DreamBooth-LoRA), mesuré comme dans le papier DreamBooth : similarité DINO au sujet et CLIP au prompt, 4 prompts × 8 graines appariés avant/après."
    duree_test: "20 s"
    duree_complet: "8 min"
    resultat: "fidélité au sujet (DINO) 0,281 → 0,751 (p < 0,001) ; fidélité au prompt (CLIP) 0,300 → 0,293 (n.s.)"
    reserve: "un seul sujet, références de mesure = photos d'entraînement ; pose et fond des photos souvent recopiés"
    prerequis: {gpu: requis, extras: [diffusers]}

  - chemin: 04-optimisation-preferences
    statut: demontre
    tentatives: 2
    fait: "DPO LoRA de Qwen2.5-0.5B, d'abord aligné par un SFT complet sur 8 000 paires (`--set modele.nom=Qwen/Qwen2.5-0.5B --set depart_sft.activer=true`), sur 16 000 paires UltraFeedback ; un modèle de récompense externe compare ses réponses à celles du modèle de départ ; témoin SFT sur les réponses préférées, de même volume."
    duree_test: "1 min"
    duree_complet: "2 h 10 par graine"
    resultat: "victoires du DPO contre le témoin SFT 0,666 ± 0,020 sur 3 graines (0,688 ; 0,660 ; 0,650, intervalle qui exclut 0,5 à chacune) ; contre le départ 0,696 ; le SFT seul 0,505 ; note du juge +1,36"
    reserve: "réponses 13 % plus longues après le DPO (311 → 351 mots), longueur non contrôlée ; un seul juge (modèle de récompense Skywork 1,7B) ; depuis Qwen2.5-0.5B-Instruct déjà aligné, le gain est faible (0,533, net sur 2 graines sur 3)"
    prerequis: {gpu: requis}
  - chemin: 04-optimisation-preferences/variantes/dpo-iteratif
    statut: demontre
    fait: "Deux tours de DPO LoRA sur des paires que Qwen2.5-0.5B-Instruct produit lui-même (4 réponses à 500 demandes UltraFeedback, classées par Skywork-Reward-V2 0,6B) ; mesure par un autre juge (Skywork-Reward-V2 1,7B) ; nombre de tours fixé avant la mesure, trois graines neuves."
    duree_complet: "1 h 10"
    resultat: "victoires contre le départ après 2 tours : 0,592 ± 0,025 sur trois graines neuves (0,572 ; 0,584 ; 0,620), intervalle de chaque graine au-dessus de 0,5 ; non-régression arithmétique conservée (0,962 contre 0,955) ; DPO hors-ligne de l'exemple principal : 0,533. Graines 42 à 44 à 3 tours : 0,625 ± 0,009"
    reserve: "au tour 3 la non-régression arithmétique s'effondre sur une graine sur trois (0,955 → 0,61), d'où deux tours ; pas de témoin à calcul égal ; juges de la même famille, le gain est en partie un gain aux yeux de ce juge"
    prerequis: {gpu: requis}

  - chemin: 05-rl-en-ligne
    statut: non-prouve
    tentatives: 1
    fait: "RL (DAPO) sur 800 problèmes de GSM8K : le modèle est récompensé quand sa réponse finale est juste, sans solution rédigée."
    duree_test: "21 s"
    duree_complet: "1 h 05"
    resultat: "GSM8K (n = 1 319) : 0,411 → 0,465 (p = 0,0002) ; non-régression 0,955 → 0,955"
    reserve: "une graine et aucun témoin (SFT à volume égal, récompense aléatoire) ; le départ à 0,411 est sous le chiffre publié pour ce modèle, peut-être par troncature à 512 tokens ou repli sur le dernier nombre du texte : le gain pourrait être un gain de format, pas de raisonnement"
    piste: "3 graines, témoin SFT à volume égal, part des sorties avec « Answer: » avant et après, gains recalculés en extraction stricte."
    prerequis: {gpu: requis, api: true}
  - chemin: 05-rl-en-ligne/variantes/modele-recompense
    statut: demontre
    fait: "Entraîne un modèle de récompense (Qwen2.5-0.5B-Instruct, perte de Bradley-Terry) sur 4 000 paires de préférences UltraFeedback, mesuré sur 500 paires jamais vues, 3 graines."
    duree_test: "13 s"
    duree_complet: "5 min"
    resultat: "paires bien classées 0,470 ± 0,031 → 0,631 ± 0,017 (+0,161, p de McNemar < 10⁻³, intervalle de Wilson qui exclut 0,5 sur chaque graine) ; modèle publié Skywork 0,6B : 0,704"
    reserve: "0,073 sous le modèle publié (entraîné sur un jeu de préférences bien plus grand et un modèle plus grand) ; un modèle de récompense se fait exploiter par la politique pendant le RL"
    prerequis: {gpu: requis}

  - chemin: 06-distillation
    statut: non-prouve
    tentatives: 1
    fait: "Qwen2.5-3B-Instruct résout des problèmes de GSM8K ; Qwen2.5-0.5B-Instruct est entraîné sur ses solutions justes. Témoin : même entraînement sur les solutions humaines du jeu."
    duree_test: "16 s"
    duree_complet: "1 h 30"
    resultat: "GSM8K (n = 1 319) : élève 0,411 → 0,451 ; témoin solutions humaines 0,302 ; enseignant 0,760"
    reserve: "gain de 4 points sur une graine, l'élève reste loin de l'enseignant ; le témoin « solutions humaines » (0,302) est sous le départ : il montre que le style très court dégrade, pas que la distillation apporte ; non-régression 0,955 → 0,915"
    piste: "Témoin de même style (auto-distillation filtrée), 3 graines."
    prerequis: {gpu: requis}
  - chemin: 06-distillation/variantes/encodeur-classification
    statut: demontre
    fait: "Un petit classifieur (BERT-mini, 11 M) apprend d'un gros (RoBERTa ou ModernBERT) en annotant des textes sans étiquette ; comparé à un élève sans enseignant, à un élève pseudo-étiqueté (étiquettes dures de l'enseignant) et à un élève distillé (probabilités), sur sentiment SST-2 (2 classes) et sur banking77 (77 classes), 3 graines chacune."
    duree_test: "25 s"
    duree_complet: "78 s"
    resultat: "banking77 (3 080 messages) : sans enseignant 0,421 ± 0,010 ; pseudo-étiqueté 0,9015 ± 0,0007 (+0,481, net sur chaque graine) ; distillé 0,901 ± 0,004 (température 1, alpha 0,9, choisis sur 3 graines de réglage, mesurés sur 3 graines neuves) ; enseignant 0,937. SST-2 (872 phrases) : sans enseignant 0,768 ; pseudo-étiqueté 0,827 (+0,060, net) ; distillé 0,829 ; enseignant 0,940"
    reserve: "le gain vient des textes sans étiquette annotés par l'enseignant, pas de la perte KL : distillé contre pseudo-étiqueté +0,002 sur 2 classes et −0,001 sur 77 classes après réglage, non significatif sur chaque graine ; avec un jeu de transfert réduit à 900 messages, l'écart change de signe selon la graine (−0,002 en moyenne sur 3 graines neuves)"
    prerequis: {gpu: conseille}

  - chemin: 07-donnees-synthetiques
    statut: demontre
    tentatives: 3
    fait: "Qwen2.5-0.5B de base, amorcé par 4 exemples, résout 3 000 problèmes de GSM8K 8 fois chacun et garde au plus 4 solutions justes aux calculs distincts par question (RFT, ReST-EM) ; pour les questions ratées, il rédige un raisonnement à partir de la réponse attendue en indice (STaR). Une époque de SFT ; témoin sur les solutions humaines."
    duree_test: "30 s"
    duree_complet: "3 h 37 (3 graines)"
    resultat: "GSM8K (n = 1 319, 3 graines) 0,363 → 0,397 ± 0,008 (+0,034 ± 0,008, net à chaque graine) ; témoin solutions humaines 0,330 ; non-régression arithmétique 0,465 → 0,907"
    reserve: "gain modeste (3 points) dont une part est le format « Answer: N » (0,001 → 0,70) ; le témoin humain est sous le départ, la comparaison au départ est la prudente ; depuis le modèle instruct, aucun gain (0,411 → 0,393, non significatif)"
    prerequis: {gpu: requis}

  - chemin: 08-fusion-modeles
    statut: non-prouve
    fait: "Fusionne Qwen2.5-1.5B-Instruct dans sa base par DARE-TIES, sur CPU, sans données."
    duree_test: "21 s"
    duree_complet: "3 min"
    resultat: "GSM8K : base 0,07 ; Instruct 0,51 ; fusion DARE-TIES 0,55"
    reserve: "un seul modèle est fusionné, donc rien à combiner ; le départ à 0,07 vient du chat template appliqué à un modèle de base, pas d'un échec réel ; 0,55 contre 0,51 sur n = 100 est dans le bruit ; ni graine ni témoin"
    piste: "Fusionner deux compétences d'une même base Qwen2.5-0.5B (routage banking77 et RL GSM8K), mesurer chaque compétence avec ses sources et un témoin, 3 graines."
    prerequis: {gpu: conseille}
  - chemin: 08-fusion-modeles/variantes/deux-competences
    statut: a-reexaminer
    tentatives: 3
    fait: "Fusionne deux spécialistes de Qwen2.5-0.5B-Instruct (routage de messages bancaires ; raisonnement GSM8K, entraîné sur les solutions justes de Qwen2.5-3B-Instruct) par fusion linéaire, arithmétique des tâches, TIES et DARE-TIES, 3 graines."
    duree_complet: "1 h 40"
    resultat: "GSM8K (1 319 problèmes, 3 graines), arithmétique des tâches : routage 0,840 (spécialiste 0,837, base 0,226) et raisonnement souple 0,443 (spécialiste 0,465, base 0,374), net contre la base sur chaque graine ; raisonnement strict 0,291 (base 0,175)"
    reserve: "AVERTISSEMENT : trois tentatives sans preuve ; la fusion garde tout le gain de routage mais seulement environ trois quarts de celui du raisonnement (0,443 contre 0,465 pour le spécialiste, base 0,374), un gain de départ trop petit (+0,09) pour que la rétention se mesure sans bruit ; la fusion reste de 0,015 à 0,027 sous le spécialiste, écart significatif sur 1 graine sur 3"
    prerequis: {gpu: requis}
    piste: "Remplacer le raisonnement par une compétence que le petit modèle gagne beaucoup à apprendre (extraction d'entités ou de champs, ou une seconde classification), pour que les deux gains soient grands et la rétention bien conditionnée."

  - chemin: 09-edition-connaissances
    statut: demontre
    fait: "Modifie dans les poids 100 faits du jeu CounterFact par ROME, un par un, sur Qwen2.5-1.5B ; efficacité, généralisation aux paraphrases et spécificité sur les faits voisins, 3 graines."
    duree_test: "12 s"
    duree_complet: "6 min"
    resultat: "efficacité 0,170 → 0,990, généralisation 0,200 → 0,932 (écarts appariés +0,82 et +0,73, intervalle qui exclut 0 sur chaque graine) ; spécificité 0,830 → 0,818 (−0,012, net mais petit)"
    reserve: "chaque fait est édité seul, le poids étant restauré ensuite : l'accumulation de nombreuses éditions n'est pas mesurée"
    prerequis: {gpu: requis}

  - chemin: 10-desapprentissage
    statut: demontre
    fait: "Fait oublier 10 personnages appris sur 80 par la méthode idk (réponse « je ne sais pas »), avec 50 personnages dans la perte de rétention ; rétention mesurée sur 20 personnages tenus à l'écart, oubli aussi sur reformulations et en français, trois graines neuves."
    duree_test: "20 s"
    duree_complet: "1 min"
    resultat: "oubli 0,983 → 0,025 (reformulé 0,942 → 0,242, écart net sur chaque graine) ; rétention sur personnages tenus à l'écart 0,996 → 0,954 (0,975 ; 0,963 ; 0,925) ; aucune sortie dégénérée ; perplexité générale 29,1 → 29,0. À 40 personnages (20 en rétention) : rétention 0,992 → 0,825, effondrée sur une graine sur trois ; NPO et gradient_difference : 0,25 à 0,58 dans tous les réglages"
    reserve: "idk apprend un refus plutôt qu'il n'efface l'information : 24 % des questions reformulées sur les faits oubliés obtiennent encore la bonne réponse ; personnages inventés, modèle de 0,5B"
    prerequis: {gpu: requis}

  - chemin: 11-pilotage-activations
    statut: demontre
    fait: "Rend les réponses plus positives en retirant des poids une direction d'activations (60 paires, mode ablation), sur des sujets jamais utilisés pour calculer la direction ; fluidité mesurée par la perte par token et note d'un juge externe sur les demandes neutres ; trois graines neuves, critère fixé avant la mesure."
    duree_test: "12 s"
    duree_complet: "35 s"
    resultat: "ablation : positivité des demandes de texte négatif +0,29, +0,25, +0,35 (intervalle apparié qui exclut 0 sur chaque graine) ; perte par token inchangée (−0,06 à +0,03) ; demandes neutres inchangées (note du juge −0,04 à +0,03). Par vecteur : aucun α ni aucune profondeur d'injection (0,25 à 0,75) ne respecte le seuil de cohérence avec une hausse nette de positivité"
    reserve: "le critère retenu (note du juge exigée sur les demandes neutres seulement) diffère du seuil de cohérence par défaut, qui pénalise par construction un texte positif en réponse à une demande de texte négatif (note du juge −1,8 à −2,0 sur ces demandes) ; le pilotage par vecteur est un réglage entre effet et cohérence"
    prerequis: {gpu: requis}

  - chemin: 12-extension-contexte
    statut: a-reexaminer
    tentatives: 3
    fait: "Fait passer SmolLM-360M de 2 048 à 8 192 tokens de contexte par YaRN et un court entraînement, 3 graines."
    duree_test: "15 s"
    duree_complet: "45 min"
    resultat: "clé cachée dans du texte varié à 4 096 tokens 0,07 → 1,00 par YaRN seul (n = 30, net sur chaque graine) ; perplexité à 8 192 tokens 422 → 19,4 (YaRN seul) → 18,7 (entraîné) ; tâche multi-clés à 4 096 tokens 0,08 → 0,36 par YaRN seul"
    reserve: "AVERTISSEMENT : trois démonstrations de l'apport de l'entraînement ont échoué (clé cachée, deux codes, multi-clés avec et sans tâches de récupération) ; YaRN seul suffit pour une clé unique, aucun entraînement testé n'améliore la tâche multi-clés (récupération contre témoin : écart de 0,00, −0,01 et −0,02 à 2 048, 4 096 et 7 000 tokens, non significatifs) ; seule la perplexité s'améliore"
    piste: "Aucune piste automatique : à investiguer (modèle plus grand que SmolLM-360M, tâche mesurée, ou signal d'entraînement beaucoup plus fort)."
    prerequis: {gpu: requis}

