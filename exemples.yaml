    calcul: 0
    duree: 1
    acces: ferme
    donnees: aucune
  - dossier: 20-calcul-inference
    titre: Calcul à l'inférence
    court: "Inférence"
    categorie: inference
    regroupe: "Self-consistency, best-of-N (RM, vraisemblance), self-refine, pass@N"
    modeles: "Tout LLM ; code ; diffusion (best-of-N)"
    local: "✅"
    calcul: 1
    duree: 1
    acces: ferme
    donnees: aucune

# Un exemple = le run.py d'un dossier de méthode ou d'une de ses variantes.
# Résultats : configuration complète sur le matériel de référence, mesures de septembre 2026.
# duree_test / duree_complet : durée mesurée du test rapide et de l'exemple complet sur ce matériel.
exemples:
  - chemin: 01-pre-entrainement-continu
    statut: non-prouve
    duree_test: "12 s"
    duree_complet: "56 s"
    resultat: "perplexité domaine 130 → 9,5 ; générale 20,2 → 22,6 ; questions sur les faits 0 → 0,04"
    reserve: la connaissance apprise n'est pas extractable par question
    prerequis: {gpu: requis}
  - chemin: 01-pre-entrainement-continu/variantes/mlm-encodeur
    statut: demontre
    duree_test: "8 s"
    duree_complet: "17 s"
    resultat: "perte MLM 2,38 → 1,09"
    reserve: sans intervalle de confiance
    prerequis: {gpu: conseille}

  - chemin: 02-fine-tuning-supervise
    statut: non-prouve
    duree_test: "10 s"
    duree_complet: "2 min"
    resultat: "exactitude 0,955 → 0,885"
    reserve: tâche arithmétique déjà résolue par le modèle de départ
    prerequis: {gpu: requis}
  - chemin: 02-fine-tuning-supervise/variantes/classification-encodeur
    statut: demontre
    duree_test: "10 s"
    duree_complet: "76 s"
    resultat: "SST-2 0,54 → 0,95"
    prerequis: {gpu: conseille}
  - chemin: 02-fine-tuning-supervise/variantes/vision
    statut: demontre
