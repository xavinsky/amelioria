    piste: "Tester sur les 1 319 questions de test pour resserrer l'intervalle, ou une tâche où la consigne compte davantage."
    duree_test: "18 s"
    duree_complet: "20 min"
    resultat: "GSM8K : zéro-shot 0,60 ; instruction 0,67 ; CoT 0,67 ; few-shot 0,535 ; OPRO 0,575"
    reserve: écarts dans l'intervalle de confiance
    prerequis: {gpu: conseille, api: true}

