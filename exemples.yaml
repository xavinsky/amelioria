    statut: non-prouve
    fait: "Met à zéro 50 % des poids de Qwen2.5-0.5B (Wanda), puis récupère la qualité par distillation."
    piste: "Plus de pas de distillation, ou un élagage 2:4 moins agressif, pour récupérer la tâche."
    duree_test: "21 s"
    duree_complet: "6 min"
    resultat: "perplexité 22,3 → 37,9 → 25,4 ; tâche 0,88 → 0,31 → 0,42"
    reserve: la cicatrisation ne récupère qu'une partie de la tâche
    prerequis: {gpu: requis}

