  - chemin: 17-optimisation-prompt
    statut: demontre
    fait: "Compare des stratégies de prompt (consigne, consigne optimisée par OPRO, exemples au hasard, exemples les plus proches) pour router des messages bancaires vers 77 intentions, sans entraînement ; consigne choisie sur 500 messages de validation, mesure sur 3 080 messages de test, 3 graines."
    duree_test: "18 s"
    duree_complet: "9 min"
    resultat: "intentions : zéro-shot 0,229 ; consigne à la main 0,225 ; consigne OPRO 0,259 ± 0,008 (+0,034 sur la consigne à la main, net sur chaque graine) ; 8 exemples au hasard 0,311 ; 8 exemples les plus proches 0,813 (+0,584 sur le zéro-shot)"
    reserve: "le gain vient surtout du choix des exemples par proximité, et le vote des mêmes voisins sans LLM fait mieux (0,920) ; la consigne OPRO ajoute peu (+3 points), son écart n'est pas significatif sur la validation et les consignes trouvées sont peu cohérentes"
    prerequis: {gpu: conseille, api: true}

  - chemin: 18-rag
    statut: demontre
    fait: "Répond à des questions sur 50 personnages inventés en cherchant les bons passages parmi 2 100, dont 50 personnages au nom presque identique et 2 000 paragraphes sans rapport."
    duree_test: "14 s"
    duree_complet: "54 s"
    resultat: "exactitude sans RAG 0,002, passages au hasard 0,007, RAG 0,982 ± 0,014 sur 3 graines ; rappel@3 = 1,0 ; confusion avec le personnage au nom voisin 1,3 %"
    reserve: "refus sur les questions sans réponse : 59 % avec RAG, autant qu'avec des passages au hasard (57 %) ; corpus de personnages inventés"
    prerequis: {gpu: conseille, api: true}

  - chemin: 19-outils-agents
    statut: demontre
    fait: "Donne au modèle une calculatrice et une base de fiches qu'il appelle pour répondre ; mesure par type de question, avec et sans outils, sur 250 questions."
    duree_test: "10 s"
    duree_complet: "2 min"
    resultat: "calcul 0,57 → 1,00 ; fiche 0,00 → 0,93 ; calcul trivial 1,00 → 1,00 ; écart net par outil sur 3 graines"
    reserve: "le modèle appelle un outil pour toutes les questions, même triviales (la consigne y invite) ; sans outil la fiche est inconnue par construction"
    prerequis: {gpu: conseille, api: true}

  - chemin: 20-calcul-inference
    statut: demontre
    fait: "Génère 16 réponses par question GSM8K (Qwen2.5-1.5B-Instruct) et garde la plus fréquente ou la mieux notée, contre la réponse gloutonne, sur 500 problèmes et 3 graines."
    duree_test: "9 s"
    duree_complet: "47 min"
    resultat: "GSM8K (n = 500) : glouton 0,684 ; vote majoritaire sur 16 réponses 0,795 ± 0,003 (+0,111 apparié, net sur chaque graine) pour 16 fois plus de générations ; meilleure réponse par récompense 0,767 ; borne oracle 0,923"
    reserve: "coût linéaire (×16) ; une seule réponse échantillonnée (0,591) est moins bonne que le glouton, il en faut environ 4 pour le rattraper ; le départage par vraisemblance (+0,004) et l'auto-correction (+0,008) ne se distinguent pas du glouton"
    prerequis: {gpu: conseille, api: true}
