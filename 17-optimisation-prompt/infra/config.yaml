# Optimisation de prompt à grande échelle : modèle servi par vLLM (multi-GPU), optimiseur plus fort, jeux plus grands.
#   vllm serve Qwen/Qwen2.5-72B-Instruct --tensor-parallel-size 4 --port 8000
modele:
  nom: Qwen/Qwen2.5-72B-Instruct
  api_base: http://localhost:8000/v1

optimiseur:
  nom: Qwen/Qwen2.5-72B-Instruct
  api_base: http://localhost:8000/v1

strategies: [zero_shot, instruction, cot, few_shot, few_shot_similaires, optimisation]
k_exemples: 8
embeddings: BAAI/bge-base-en-v1.5

optimisation:
  tours: 10
  candidats: 8

donnees:
  source: gsm8k
  n_train: 2000

evaluation:
  mode: nombre
  n_dev: 300
  n_test: 1000
  max_new_tokens: 512
