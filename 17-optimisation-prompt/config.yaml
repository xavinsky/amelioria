# Optimisation de prompt — poste local (inférence seule) ou n'importe quelle API compatible OpenAI
modele:
  nom: Qwen/Qwen2.5-0.5B-Instruct   # même modèle que DATA02 et DATA03 : prompt et fine-tuning comparés sur la même tâche
  api_base: null                    # ex. http://localhost:11434/v1 (Ollama, nom: qwen3:8b) ou https://api.openai.com/v1

optimiseur:                         # modèle qui propose les instructions (souvent plus fort que le modèle optimisé)
  nom: null                         # null = le modèle lui-même
  api_base: null

strategies: [zero_shot, instruction, few_shot, few_shot_similaires, optimisation]   # + cot pour une tâche de raisonnement
k_exemples: 8
embeddings: sentence-transformers/all-MiniLM-L6-v2

prompts:
  instruction: >-
    Read the customer's message carefully and choose the single most specific intent. Several intents are close
    (for example card_arrival and card_delivery_estimate, or pending_transfer and transfer_timing): pick the one that
    matches exactly what the customer asks.
  cot: "Think step by step, then give the final answer."

optimisation:
  tours: 4
  candidats: 4
  tache: "route the messages of a bank's customers to the right intent label"

donnees:
  source: banking77                 # messages de clients d'une banque -> 77 intentions (mêmes données que DATA02, DATA03)
  n_train: 9803                     # réserve d'exemples pour le few-shot
  graine: 0

evaluation:
  mode: etiquette
  dev_depuis_train: true            # validation prise dans l'entraînement : tout le jeu de test sert à la confirmation
  n_dev: 500
  n_test: 3080
  max_new_tokens: 16
  batch: 32
  systeme: |-
    You route the messages of a bank's customers. Reply with exactly one intent label from this list, and nothing else.
    Intents: {intentions}

# Raisonnement mathématique, où la consigne et le raisonnement pas à pas comptent davantage :
#   SET="donnees.source=gsm8k donnees.n_train=500 evaluation.mode=nombre evaluation.dev_depuis_train=false
#        evaluation.n_dev=60 evaluation.n_test=200 evaluation.max_new_tokens=384 evaluation.systeme=null" ...
#   avec les prompts.instruction / optimisation.tache adaptés (voir README).

quick:
  modele:
    nom: HuggingFaceTB/SmolLM2-135M-Instruct
  strategies: [zero_shot, few_shot, few_shot_similaires, optimisation]
  k_exemples: 2
  optimisation:
    tours: 1
    candidats: 2
  donnees:
    n_train: 40
  evaluation:
    n_dev: 8
    n_test: 16
