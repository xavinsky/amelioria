# Élagage — poste local (GPU 12 Go)
modele:
  nom: Qwen/Qwen2.5-0.5B-Instruct   # 12 Go : 0,5B avec cicatrisation ; 1,5B avec cicatrisation.mode=aucune
  dtype: float32

methode: wanda                      # magnitude | wanda | 2:4 | couches | largeur
sparsite: 0.5                       # magnitude / wanda : part des poids mis à zéro dans chaque ligne
n_couches: 6                        # couches : nombre de blocs retirés (28 -> 22)
ratio_largeur: 0.3                  # largeur : part des neurones MLP retirés

calibration:
  n: 128

cicatrisation:
  mode: distillation                # aucune | lm | distillation
  n_textes: 4000                    # paragraphes Wikipédia
  n_conversations: 1765             # demandes générales + réponses du modèle d'origine (même cache que le remélange de DATA02/03)
  longueur_bloc: 256
  entrainement:
    max_steps: 1000
    batch: 2
    accumulation: 8
    optim: adamw_bnb_8bit           # AdamW 8 bits : l'enseignant (original) tient à côté de l'élève
    lr: 2.0e-5
    warmup: 20
    logging_steps: 20
    gradient_checkpointing: true

donnees:
  source: arith
  niveau: 1

evaluation:
  mode: nombre
  n: 300
  max_new_tokens: 256               # assez long pour que la réponse finale du modèle d'origine ne soit pas coupée
  n_textes_generaux: 50

sauvegarder: true

quick:
  modele:
    nom: HuggingFaceTB/SmolLM2-135M-Instruct
  n_couches: 2
  calibration:
    n: 4
  cicatrisation:
    mode: lm
    n_textes: 40
    n_conversations: 11
    longueur_bloc: 64
    entrainement:
      max_steps: 2
      batch: 2
      accumulation: 1
      gradient_checkpointing: false
  evaluation:
    n: 4
    max_new_tokens: 24
    n_textes_generaux: 4
  sauvegarder: false
