# SFT complet — poste local (GPU 12 Go)
modele:
  nom: Qwen/Qwen2.5-0.5B-Instruct
  dtype: float32                  # poids maîtres en fp32, calcul en bf16 (précision mixte) : le plus stable

donnees:
  source: banking77               # messages de clients d'une banque -> l'une de 77 intentions (voir commun/donnees.py)
  n_train: 10003                  # tout le jeu d'entraînement, ~130 exemples par intention
  graine: 0
  remelange:                      # contre l'oubli : demandes générales + réponses du modèle d'origine
    part: 0.15                    # part des exemples d'entraînement ; 0 : sans remélange
    max_new_tokens: 512             # réponses plus longues écartées (coupées)
  # source: hf                    # vos propres demandes annotées : voir README
  # nom: json
  # fichiers: mes_demandes.jsonl
  # champs: {question: texte, reponse: intention}

entrainement:
  max_length: 640                 # prompt avec la liste des 77 intentions (~440 tokens) + message + réponse
  epochs: 2
  batch: 4                        # lots de 4 x 4 : poids fp32, AdamW et logits (vocabulaire de 152 000) tiennent en 12 Go
  accumulation: 4
  gradient_checkpointing: true
  lr: 1.0e-5                      # SFT complet : 5e-6 à 2e-5
  warmup: 0.03
  scheduler: cosine
  weight_decay: 0.0
  logging_steps: 50

evaluation:
  mode: etiquette                   # réponse juste = l'intention attendue, en première ligne
  n: 3080                           # tout le jeu de test de banking77
  max_new_tokens: 16
  batch: 32
  systeme: |-
    You route the messages of a bank's customers. Reply with exactly one intent label from this list, and nothing else.
    Intents: {intentions}
  non_regression:                   # tâche hors sujet que le modèle de départ réussit : elle ne doit pas se dégrader
    source: arith
    niveau: 2
    n: 200
    mode: nombre
    max_new_tokens: 256

sauvegarder: true

quick:
  modele:
    nom: HuggingFaceTB/SmolLM2-135M-Instruct
  donnees:
    n_train: 64
    remelange:
      max_new_tokens: 64
  entrainement:
    epochs: 1
    batch: 8
    accumulation: 1
  evaluation:
    n: 32
    non_regression:
      n: 8
      max_new_tokens: 48
  sauvegarder: false
