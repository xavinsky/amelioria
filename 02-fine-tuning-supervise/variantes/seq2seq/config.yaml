# SFT encodeur-décodeur — poste local
# bf16 désactivé : T5 est instable en bf16/fp16 (débordements), on reste en fp32.
modele:
  nom: google/flan-t5-base          # google/flan-t5-large, facebook/bart-large, google/mt5-base, facebook/nllb-200-distilled-600M

donnees:
  source: hf
  nom: knkarthick/dialogsum         # conversations du quotidien et du travail, résumées par des annotateurs
  champs: {question: dialogue, reponse: summary}
  n_train: 12460                    # tout le jeu d'entraînement
  n_test_lignes: 1500               # 500 conversations de test × 3 résumés de référence
  consigne: "Summarize the following dialogue:\n"
  # source: arith                   # problèmes d'arithmétique (evaluation.mode: nombre, consigne: "")

entrainement:
  max_length: 512                   # conversation en entrée
  max_length_cible: 128             # résumé
  epochs: 2
  batch: 4
  accumulation: 4
  gradient_checkpointing: true
  lr: 1.0e-4
  warmup: 0.05
  logging_steps: 50

evaluation:
  mode: rouge_l                     # rouge_l (résumés) | nombre (arithmétique)
  n: 500                            # conversations de test
  max_new_tokens: 96
  batch: 32
  fidelite: cross-encoder/nli-deberta-v3-base   # modèle d'inférence textuelle : le dialogue implique-t-il le résumé ?

sauvegarder: false

quick:
  modele:
    nom: google/flan-t5-small
  donnees:
    n_train: 64
    n_test_lignes: 48
  entrainement:
    epochs: 1
    batch: 8
    accumulation: 1
  evaluation:
    n: 8
    max_new_tokens: 32
  sauvegarder: false
