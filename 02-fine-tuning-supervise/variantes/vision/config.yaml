# Classification d'images — poste local
modele:
  nom: google/vit-base-patch16-224-in21k   # facebook/dinov2-small, facebook/convnext-tiny-224, microsoft/swin-tiny-patch4-window7-224...

donnees:
  nom: uoft-cs/cifar10                     # tout dataset HF image + label (ClassLabel)
  split_train: train
  split_test: test
  colonne_image: img
  colonne_label: label
  n_train: 10000
  n_test: 1000

entrainement:
  epochs: 2
  batch: 32
  lr: 5.0e-5
  warmup: 0.1
  weight_decay: 0.01
  logging_steps: 50
  autres:
    dataloader_num_workers: 4

sauvegarder: false

quick:
  modele:
    nom: facebook/deit-tiny-patch16-224
  donnees:
    n_train: 256
    n_test: 128
  entrainement:
    epochs: 1
    batch: 16
    autres:
      dataloader_num_workers: 0
  sauvegarder: false
