# Calcul à l'inférence à grande échelle : génération massive par vLLM (n=64 par question)
#   vllm serve Qwen/Qwen2.5-7B-Instruct --tensor-parallel-size 1 --data-parallel-size 8
modele:
  nom: Qwen/Qwen2.5-7B-Instruct
  api_base: http://localhost:8000/v1

consigne: "Think step by step and end with 'Answer: <number>'."
strategies: [vote_majoritaire, best_of_n_recompense, auto_correction]
