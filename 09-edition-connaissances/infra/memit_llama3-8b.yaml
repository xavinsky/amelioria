# Hyperparamètres MEMIT pour EasyEdit (format des fichiers hparams/MEMIT/*.yaml du dépôt EasyEdit).
# MEMIT = ROME généralisé : des milliers de faits répartis sur plusieurs couches en une seule mise à jour.
alg_name: "MEMIT"
model_name: "meta-llama/Meta-Llama-3-8B-Instruct"
stats_dir: "./data/stats"             # covariances des clés, calculées une fois (le plus long : ~1 h sur 1 GPU)
device: 0
layers: [4, 5, 6, 7, 8]
clamp_norm_factor: 4
layer_selection: "all"
fact_token: "subject_last"
v_num_grad_steps: 25
v_lr: 5e-1
v_loss_layer: 31
v_weight_decay: 1e-3
kl_factor: 0.0625
mom2_adjustment: false
mom2_update_weight: 15000
rewrite_module_tmp: "model.layers.{}.mlp.down_proj"
layer_module_tmp: "model.layers.{}"
mlp_module_tmp: "model.layers.{}.mlp"
attn_module_tmp: "model.layers.{}.self_attn"
ln_f_module: "model.norm"
lm_head_module: "lm_head"
mom2_dataset: "wikipedia"
mom2_n_samples: 100000
mom2_dtype: "float32"
model_parallel: false
