# Fusion de modèles — poste local (la fusion se fait sur CPU/RAM : base + source 1,5B en bf16 ≈ 6 Go de RAM)
methode: dare_ties                  # lineaire | slerp | arithmetique_taches | ties | dare_ties | dare_lineaire
dtype: bfloat16

base: Qwen/Qwen2.5-1.5B             # modèle commun dont dérivent les sources (inutile pour lineaire et slerp)
modeles:                            # fine-tunes du MÊME modèle de base : écart relatif à la base de quelques % (affiché)
  - nom: Qwen/Qwen2.5-1.5B-Instruct       # vecteur de tâche : suivre les instructions, raisonner pas à pas (GSM8K)
    poids: 1.0
  # Plusieurs compétences : ajouter d'autres fine-tunes de la même base, par exemple les modèles produits
  # par les dossiers 02, 05 ou 07 à partir de Qwen/Qwen2.5-0.5B-Instruct (avec base: Qwen/Qwen2.5-0.5B).
tokenizer: Qwen/Qwen2.5-1.5B-Instruct
densite: 0.3                        # ties/dare : part des coordonnées de chaque vecteur de tâche conservée
t_slerp: 0.5                        # slerp : 0 = 1er modèle, 1 = 2e modèle

donnees:
  source: gsm8k

evaluation:
  mode: nombre
  n: 100
  max_new_tokens: 384
  evaluer_sources: true
  perplexite_generale: true
  n_textes_generaux: 50

sauvegarder: true

quick:
  methode: lineaire
  dtype: float32
  base: null
  modeles:
    - nom: HuggingFaceTB/SmolLM2-135M
      poids: 0.5
    - nom: HuggingFaceTB/SmolLM2-135M-Instruct
      poids: 0.5
  tokenizer: HuggingFaceTB/SmolLM2-135M-Instruct
  donnees:
    source: arith
  evaluation:
    n: 8
    max_new_tokens: 48
    n_textes_generaux: 8
  sauvegarder: false
