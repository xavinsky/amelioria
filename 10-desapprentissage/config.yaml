# Désapprentissage — poste local (GPU 12 Go)
modele:
  nom: Qwen/Qwen2.5-0.5B-Instruct
  dtype: float32

donnees:
  source: faits                     # faits (personnages générés) | tofu (locuslab/TOFU, avec un modèle déjà fine-tuné dessus)
  n_entites: 80
  part_oubli: 0.125                 # 10 personnages sur 80, 40 questions ; TOFU : forget01 / forget05 / forget10
  part_tenu: 0.25                   # personnages jamais vus par la perte : mesure de rétention hors perte
  graine: 0

implantation:                       # phase 0 : le modèle apprend d'abord les personnages (SFT)
  activer: true                     # false si modele.nom connaît déjà les données à oublier
  epochs: 8
  batch: 8
  accumulation: 2
  gradient_checkpointing: true
  lr: 2.0e-5
  logging_steps: 20

desapprentissage:
  methode: idk                      # gradient_ascent | gradient_difference | npo | idk
  beta: 0.1                         # npo
  retenu: true                      # npo : ajouter la perte de rétention (NPO+RT)
  poids_retenu: 5.0
  seuil_oubli: 0.05                 # arrêt dès que l'exactitude sur l'oubli passe sous ce seuil
  eval_tous: 2

entrainement:
  max_steps: 120
  batch: 8
  gradient_checkpointing: true
  lr: 2.0e-6
  logging_steps: 10

evaluation:
  max_new_tokens: 24
  n_retenu: 120
  n_textes_generaux: 40

sauvegarder: true

quick:
  modele:
    nom: HuggingFaceTB/SmolLM2-135M-Instruct
  donnees:
    n_entites: 12
  implantation:
    epochs: 1
    batch: 8
  entrainement:
    max_steps: 3
    batch: 4
  evaluation:
    n_retenu: 8
    n_textes_generaux: 4
  sauvegarder: false
