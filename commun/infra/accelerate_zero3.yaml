# DeepSpeed ZeRO-3 : équivalent fonctionnel de FSDP, avec offload CPU/NVMe possible.
# Pour ZeRO-2 (poids répliqués, plus rapide si le modèle tient sur un GPU) : zero_stage: 2.
# Usage : accelerate launch --config_file commun/infra/accelerate_zero3.yaml <methode>/run.py --config <methode>/infra/config.yaml
compute_environment: LOCAL_MACHINE
distributed_type: DEEPSPEED
deepspeed_config:
  deepspeed_multinode_launcher: standard
  offload_optimizer_device: none   # cpu | nvme pour tenir un plus gros modèle avec moins de GPU
  offload_param_device: none
  zero3_init_flag: true
  zero3_save_16bit_model: true
  zero_stage: 3
mixed_precision: bf16
machine_rank: 0
num_machines: 1
num_processes: 8
rdzv_backend: static
same_network: true
use_cpu: false
