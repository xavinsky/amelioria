# FSDP2 : poids, gradients et états de l'optimiseur découpés entre les GPU.
# Standard PyTorch, recommandé pour l'entraînement complet de modèles de 7B à 70B+.
# Usage : accelerate launch --config_file commun/infra/accelerate_fsdp.yaml <methode>/run.py --config <methode>/infra/config.yaml
compute_environment: LOCAL_MACHINE
distributed_type: FSDP
fsdp_config:
  fsdp_version: 2
  fsdp_auto_wrap_policy: TRANSFORMER_BASED_WRAP
  fsdp_cpu_ram_efficient_loading: true
  fsdp_offload_params: false
  fsdp_reshard_after_forward: true
  fsdp_state_dict_type: FULL_STATE_DICT
  fsdp_activation_checkpointing: true
mixed_precision: bf16
machine_rank: 0
num_machines: 1
num_processes: 8
rdzv_backend: static
same_network: true
use_cpu: false
