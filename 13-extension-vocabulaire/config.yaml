# Extension de vocabulaire — poste local (GPU 12 Go)
modele:
  nom: Qwen/Qwen2.5-0.5B
  dtype: float32

vocabulaire:
  n_nouveaux: 1000                  # mots du corpus les plus « rentables » à ajouter
  min_freq: 5
  init: moyenne                     # moyenne (des embeddings des sous-tokens) | aleatoire
  liste: null                       # ou une liste explicite de tokens à ajouter

donnees:
  source: hf                        # langue peu couverte par le tokenizer de Qwen : ~2,6 caractères par token
  nom: wikimedia/wikipedia
  config: 20231101.br               # Wikipédia en breton
  colonne: text
  n_textes: 9000                    # 4/5 pour l'entraînement, 1/5 jamais vu pour les mesures ; à 3 000, l'écart avec le témoin est de +0,03
  longueur_bloc: 512
  car_max_test: 8000                # caractères gardés par article de test (mesures de longueur et de bits par caractère)
  # source: faits                   # noms inventés, très mal découpés (base fictive de commun/donnees.py)
  # n_entites: 80
  # graine: 0

phase1:                             # embeddings seuls
  epochs: 1
  batch: 2                          # logits d'un vocabulaire agrandi (152 600 tokens) : lots de 2 x 8
  accumulation: 8
  lr: 1.0e-3
  warmup: 0.05
  logging_steps: 20

phase2:                             # modèle complet
  epochs: 1
  batch: 1                          # poids fp32, AdamW et logits d'un vocabulaire agrandi : lots de 1 x 16
  accumulation: 16
  gradient_checkpointing: true
  lr: 2.0e-5
  warmup: 0.05
  logging_steps: 20

temoin: true                        # même entraînement sans nouveaux tokens, pour isoler leur effet

sauvegarder: false

quick:
  modele:
    nom: HuggingFaceTB/SmolLM2-135M
  vocabulaire:
    n_nouveaux: 20
  donnees:
    n_textes: 60
    longueur_bloc: 128
  phase1:
    batch: 4
    accumulation: 1
  phase2:
    batch: 4
    accumulation: 1
  sauvegarder: false
