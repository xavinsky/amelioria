# DPO itératif on-policy sur de vraies demandes — poste local
modele:
  nom: Qwen/Qwen2.5-0.5B-Instruct
  dtype: float32

algo: dpo
beta: 0.1
tours: 3

peft:
  activer: true                     # LoRA fusionnée à la fin de chaque tour : le modèle fusionné est la référence du tour suivant
  r: 16
  alpha: 32
  modules: all-linear

donnees:
  nom: trl-lib/ultrafeedback_binarized   # seules les demandes servent : les réponses viennent du modèle lui-même
  split_train: train
  split_test: test
  n_prompts_par_tour: 500           # demandes neuves à chaque tour
  graine: 0

generation:
  k: 4                              # réponses échantillonnées par demande
  temperature: 0.8
  max_new_tokens: 512
  batch: 8                          # 8 demandes x 4 réponses par lot

ecart_min: 0.0                      # écart de note minimal entre la mieux et la moins bien notée pour garder la paire

classement:                         # modèle de récompense qui fabrique les paires
  nom: Skywork/Skywork-Reward-V2-Qwen3-0.6B
  max_length: 2048
  batch: 8

juge:                               # modèle de récompense de la mesure : plus grand, il n'a pas servi à l'entraînement
  nom: Skywork/Skywork-Reward-V2-Qwen3-1.7B
  max_length: 2048
  batch: 8

entrainement:
  max_length: 1024
  epochs: 2
  batch: 1                          # 1 x 16 = lot effectif de 16
  accumulation: 16
  gradient_checkpointing: true
  lr: 5.0e-5
  warmup: 0.1
  scheduler: cosine
  logging_steps: 10

evaluation:
  n_prompts: 500                    # demandes de test, mêmes que l'exemple principal
  max_new_tokens: 512
  batch: 32
  non_regression:                   # tâche hors sujet que le modèle réussit : elle ne doit pas se dégrader
    source: arith
    niveau: 2
    n: 200
    mode: nombre
    max_new_tokens: 256

sauvegarder: false

quick:
  modele:
    nom: HuggingFaceTB/SmolLM2-135M-Instruct
  tours: 2
  donnees:
    n_prompts_par_tour: 6
  generation:
    k: 2
    max_new_tokens: 32
  juge:
    nom: Skywork/Skywork-Reward-V2-Qwen3-0.6B
  entrainement:
    max_length: 256
    epochs: 1
    batch: 2
    accumulation: 1
  evaluation:
    n_prompts: 6
    max_new_tokens: 32
    non_regression:
      n: 4
      max_new_tokens: 32
  sauvegarder: false
