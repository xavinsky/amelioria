# Optimisation des préférences — poste local (GPU 12 Go)
modele:
  nom: Qwen/Qwen2.5-0.5B-Instruct   # idéalement le modèle issu d'un SFT (sorties/02-fine-tuning-supervise/modele)
  dtype: float32

algo: dpo                           # dpo | dpo_norm | ipo | rdpo | slic | apo_zero | apo_down | nca | bco | sppo | exo | aot | discopop | orpo | simpo | cpo | kto
beta: 0.1                           # force du lien au modèle de référence (DPO : 0.01-0.5 ; IPO ~0.01 ; SimPO ~2)
label_smoothing: 0.0                # rdpo : proportion supposée de paires mal étiquetées (0.1 si laissé à 0) ; exo : 1e-3 si laissé à 0
simpo_gamma: 0.5
poids_sft: 0.0                      # > 0 : ajoute une perte SFT sur la réponse préférée (RPO), contre le déplacement de vraisemblance

peft:
  activer: true                     # LoRA : la référence est la base sans adaptateur (pas de copie), dérive limitée.
                                    # false : DPO complet, plus expressif, mais plus exposé au déplacement de vraisemblance
  r: 16
  alpha: 32
  modules: all-linear

donnees:
  source: hf                        # hf (vraies préférences) | arith (paires : bon calcul vs erreur de calcul)
  nom: trl-lib/ultrafeedback_binarized   # 62 135 paires : demandes variées, réponses de 17 modèles notées par GPT-4
  split_train: train
  split_test: test
  n_train: 16000
  graine: 0
  niveau: 2                         # arith : difficulté

juge:                               # modèle de récompense externe : note les réponses aux demandes de test
  nom: Skywork/Skywork-Reward-V2-Qwen3-1.7B
  max_length: 2048
  batch: 8

depart_sft:                         # départ non aligné : SFT complet d'un modèle de base (modele.nom) avant DPO et témoin
  activer: false                    # true avec --set modele.nom=Qwen/Qwen2.5-0.5B
  n: 8000                           # paires disjointes de celles du DPO : seule la réponse préférée sert
  entrainement:
    epochs: 1
    batch: 1
    accumulation: 16
    gradient_checkpointing: true
    optim: adamw_bnb_8bit
    lr: 2.0e-5                      # SFT complet (recette Zephyr)
    warmup: 0.1
    scheduler: cosine
    logging_steps: 50

temoin_sft:                         # même LoRA sur les seules réponses préférées : ce qu'apporte l'imitation sans la préférence
  activer: true
  entrainement:
    lr: 1.0e-4                      # taux d'usage d'un SFT LoRA

entrainement:
  max_length: 1024
  epochs: 1
  batch: 1                          # 1 x 16 = lot effectif de 16
  accumulation: 16
  gradient_checkpointing: true
  lr: 5.0e-5                        # LoRA : 5e-6 à 5e-5 ; DPO complet : 1e-7 à 1e-6, avec optim: adamw_bnb_8bit sur 12 Go
  warmup: 0.1
  scheduler: cosine
  logging_steps: 20

evaluation:
  n_prompts: 500                    # demandes de test : réponses du modèle de départ et du modèle entraîné, notées par le juge
  n_paires: 300                     # paires de test : part où le modèle préfère la réponse préférée (log-prob par token)
  max_new_tokens: 512
  batch: 32
  non_regression:                   # tâche hors sujet que le modèle réussit : elle ne doit pas se dégrader
    source: arith
    niveau: 2
    n: 200
    mode: nombre
    max_new_tokens: 256
  mode: nombre                      # source arith : exactitude sur n problèmes
  n: 200

sauvegarder: false

quick:
  modele:
    nom: HuggingFaceTB/SmolLM2-135M-Instruct
  donnees:
    n_train: 16
  juge:
    nom: Skywork/Skywork-Reward-V2-Qwen3-0.6B
  depart_sft:
    n: 16
    entrainement:
      batch: 2
      accumulation: 1
  entrainement:
    max_length: 256
    batch: 2
    accumulation: 1
  evaluation:
    n_prompts: 6
    n_paires: 8
    max_new_tokens: 32
    non_regression:
      n: 4
      max_new_tokens: 32
  sauvegarder: false
