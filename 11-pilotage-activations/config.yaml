# Pilotage par activations — poste local (GPU 12 Go ; inférence uniquement)
modele:
  nom: Qwen/Qwen2.5-1.5B-Instruct

pilotage:
  mode: vecteur                     # vecteur (hook à l'inférence) | ablation (direction retirée des poids)
  couche: null                      # null = couche_relative x nombre de couches ; les couches du milieu marchent le mieux
  couche_relative: 0.5
  n_paires: 60                      # paires contrastives positif / négatif (sujets distincts de ceux du test)
  alphas: [-2.0, 0.5, 0.75, 1.0, 1.5, 2.0]   # multiple de l'écart moyen positif - négatif ; négatif = concept opposé

evaluation:
  n: 100                            # demandes par type
  seuil:                            # cohérence admise, fixée avant la mesure : baisse de la note du juge et hausse de la perte par token
    note_juge: 0.5
    nll: 0.2
  n_sujets: 50                      # sujets de test tirés (selon la graine) parmi des sujets jamais utilisés pour la direction
  max_new_tokens: 48
  temperature: 0.7
  juge:                             # modèle de récompense externe : qualité de la réponse à la demande
    nom: Skywork/Skywork-Reward-V2-Qwen3-0.6B
    max_length: 1024
    batch: 8
  classifieur: distilbert/distilbert-base-uncased-finetuned-sst-2-english

sauvegarder: true

quick:
  modele:
    nom: HuggingFaceTB/SmolLM2-135M-Instruct
  pilotage:
    n_paires: 4
    alphas: [2.0]
  evaluation:
    n: 4
    n_sujets: 4
    max_new_tokens: 16
  sauvegarder: false
