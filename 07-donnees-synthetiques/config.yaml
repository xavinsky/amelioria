# Données synthétiques — poste local (GPU 12 Go)
modele:
  nom: Qwen/Qwen2.5-0.5B            # modèle de base, comme dans STaR et RFT : il n'a pas appris ce raisonnement
  dtype: float32
  format_texte: true                # prompts « Question: ... Answer: », sans chat template

amorce:                             # exemples few-shot en tête des prompts du modèle de base (génération et mesure de départ)
  n: 4
  graine: 999

generateur:
  nom: null                         # null = le modèle s'entraîne sur ses propres sorties filtrées ; sinon un modèle plus fort

strategie: rejet                    # rejet | self_instruct | critique_revision
tours: 1                            # STaR : plusieurs tours, chacun génère avec le modèle du tour précédent
temoin: true                        # rejet : même SFT sur les solutions humaines des mêmes questions

principes:
  - "The answer must show each calculation step and end with 'Answer: <number>'."
  - "The answer must be concise: no more than three short sentences."
  - "Every intermediate result must be arithmetically correct."

generation:
  k: 8                              # solutions échantillonnées par question
  temperature: 0.8
  toutes_justes: true               # RFT : garder toutes les solutions justes aux calculs distincts, pas une seule
  rationalisation: true             # STaR : questions ratées reprises avec la réponse attendue en indice
  k_rationalisation: 4
  max_par_question: 4               # ReST-EM : au plus 4 solutions gardées par question
  indice: "Hint: the correct final answer is {cible}. Solve the problem step by step without mentioning this hint."
  batch: 8                          # prompts few-shot longs : 8 questions x 8 solutions par lot
  n_lots: 50                        # self_instruct : nombre de demandes de 10 nouvelles questions
  filtrer: true

donnees:
  source: gsm8k                     # problèmes rédigés, réponse finale vérifiable (7 473 d'entraînement, 1 319 de test)
  n_questions: 3000                 # par tour ; seule la réponse finale sert, pour vérifier
  graine: 0
  # source: arith                   # arithmétique générée localement (self_instruct, critique_revision)

entrainement:
  max_length: 768
  epochs: 1
  batch: 4
  accumulation: 4
  gradient_checkpointing: true
  lr: 1.0e-5
  warmup: 0.03
  scheduler: cosine
  logging_steps: 20

evaluation:
  mode: nombre
  n: 1319                           # tout le jeu de test de GSM8K
  max_new_tokens: 512
  batch: 32
  taux_format: false                # part des réponses finissant par « Answer: N » (format de l'arithmétique)
  non_regression:                   # tâche hors sujet que le modèle réussit : elle ne doit pas se dégrader
    source: arith
    niveau: 2
    n: 200
    mode: nombre
    max_new_tokens: 256

sauvegarder: true

quick:
  modele:
    nom: HuggingFaceTB/SmolLM2-135M-Instruct
  amorce:
    n: 1
  tours: 1
  generation:
    k: 4
    k_rationalisation: 2
    n_lots: 2
    batch: 8
  donnees:
    source: arith
    niveau: 1                       # opérations simples : le petit modèle du test rapide en résout quelques-unes
    n_questions: 32
  entrainement:
    batch: 4
    max_steps: 2
  evaluation:
    n: 8
    max_new_tokens: 48
    non_regression:
      n: 4
      max_new_tokens: 48
  sauvegarder: false
