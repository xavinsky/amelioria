# DreamBooth-LoRA Stable Diffusion 1.5 — poste local (~8 Go VRAM)
modele:
  nom: stable-diffusion-v1-5/stable-diffusion-v1-5

peft:
  r: 8
  alpha: 8

donnees:
  source: hub                       # hub (dataset HF d'images) | dossier (images locales) | synthetique
  depot: diffusers/dog-example      # 5 photos d'un même chien
  dossier: null
  n_images: 5
  resolution: 512
  prompt: "a photo of sks dog"

entrainement:
  max_steps: 500
  batch: 1
  lr: 1.0e-4
  logging_steps: 50

evaluation:                         # chaque prompt tiré avec les mêmes graines avant et après
  prompts:
    - "a photo of sks dog"
    - "a sks dog on the beach"
    - "a sks dog in the snow"
    - "a sks dog wearing a red hat"
  n_graines: 8                      # 4 prompts × 8 graines = 32 images par état
  batch: 4
  pas: 30
  n_sauvegardees: 2                 # images écrites en PNG, par prompt et par état

mesure:                             # métriques du papier DreamBooth
  dino: facebook/dino-vits16        # fidélité au sujet : similarité aux photos du sujet
  clip: openai/clip-vit-base-patch32  # fidélité au prompt : similarité image-texte

sauvegarder: true

quick:
  modele:
    nom: hf-internal-testing/tiny-stable-diffusion-torch
  donnees:
    source: synthetique
    n_images: 4
    resolution: 64
    prompt: "a sks checkerboard pattern"
  entrainement:
    max_steps: 10
    batch: 2
    logging_steps: 5
  evaluation:
    prompts: ["a sks checkerboard pattern", "a sks checkerboard pattern on a wall"]
    n_graines: 2
    batch: 2
    pas: 2
    n_sauvegardees: 2
  sauvegarder: false
