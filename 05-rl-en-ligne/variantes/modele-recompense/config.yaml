# Modèle de récompense (Bradley-Terry) — poste local
modele:
  nom: Qwen/Qwen2.5-0.5B-Instruct   # souvent le même modèle (ou la même famille) que la politique
  dtype: float32                    # poids maîtres fp32 (calcul bf16) : en bf16 pur, les petites mises à jour se perdent dans l'arrondi

peft:
  activer: false
  r: 16
  alpha: 32
  modules: all-linear

donnees:
  source: hf                        # hf (vraies préférences) | arith (paires synthétiques : bonne réponse contre résultat décalé)
  nom: trl-lib/ultrafeedback_binarized   # ou Skywork/Skywork-Reward-Preference-80K-v0.2
  split_train: train
  split_test: test
  niveau: 2                         # source=arith
  n_train: 4000
  graine: 0

entrainement:
  max_length: 512
  epochs: 1
  batch: 8
  accumulation: 2
  lr: 1.0e-5
  warmup: 0.05
  logging_steps: 20

evaluation:
  n_paires: 500
  reference:                        # modèle de récompense publié, mesuré sur les mêmes paires (point de repère)
    nom: Skywork/Skywork-Reward-V2-Qwen3-0.6B
    max_length: 1024
    batch: 8

sauvegarder: true

quick:
  modele:
    nom: HuggingFaceTB/SmolLM2-135M-Instruct
  donnees:
    n_train: 64
  entrainement:
    batch: 8
    accumulation: 1
  evaluation:
    n_paires: 16
  sauvegarder: false
