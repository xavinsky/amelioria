# RL en ligne — poste local (GPU 12 Go)
modele:
  nom: Qwen/Qwen2.5-0.5B-Instruct
  dtype: float32

algo: dapo                          # grpo | dr_grpo | dapo | gspo | cispo | rloo
beta: null                          # null = valeur de l'algo ; > 0 ajoute une pénalité KL vers le modèle initial

recompense:
  source: regles                    # regles (RLVR) | modele (RLHF) | juge (RLAIF)
  bonus_format: false               # regles : +0,2 si la réponse finit par « Answer: <nombre> » (tâche arith)
  modele: Skywork/Skywork-Reward-V2-Qwen3-0.6B   # source=modele : nom HF ou sorties/05-rl-en-ligne--variantes--modele-recompense/modele
  juge: Qwen/Qwen2.5-1.5B-Instruct  # source=juge : modèle local, ou nom du modèle servi si api_base est renseigné
  api_base: null                    # ex. http://localhost:8000/v1 (vLLM) ou http://localhost:11434/v1 (Ollama)

peft:
  activer: false
  r: 16
  alpha: 32
  modules: all-linear

generation:
  num_generations: 8                # taille du groupe : les avantages sont relatifs au groupe
  max_completion_length: 512        # raisonnements GSM8K du modèle : ~200 à 300 tokens
  temperature: 1.0
  vllm: false                       # true : génération par vLLM (indispensable à grande échelle)

donnees:
  source: gsm8k                     # problèmes rédigés à réponse vérifiable | arith | hf_prompts (prompts sans réponse)
  n_train: 800
  graine: 0
  # source: hf_prompts
  # nom: trl-lib/ultrafeedback-prompt
  # colonne: prompt

entrainement:
  epochs: 1
  batch: 2                          # réponses par lot : leurs log-probabilités (vocabulaire de 152 000) pèsent lourd
  accumulation: 32                  # 64 réponses par pas, soit 8 questions et leurs groupes de 8
  optim: adamw_bnb_8bit             # état de l'optimiseur en 8 bits : ~3 Go de moins que AdamW en fp32
  gradient_checkpointing: true
  lr: 1.0e-6
  warmup: 0.0
  logging_steps: 5
  max_grad_norm: 1.0

evaluation:
  mode: nombre
  n: 1319                           # tout le jeu de test de GSM8K
  max_new_tokens: 512
  batch: 32
  non_regression:                   # tâche hors sujet que le modèle réussit : elle ne doit pas se dégrader
    source: arith
    niveau: 2
    n: 200
    mode: nombre
    max_new_tokens: 256

sauvegarder: true

quick:
  modele:
    nom: HuggingFaceTB/SmolLM2-135M-Instruct
  generation:
    num_generations: 4
    max_completion_length: 48
  donnees:
    source: arith
    n_train: 16
  entrainement:
    batch: 8
    accumulation: 1
    lr: 5.0e-6
    max_steps: 2
  evaluation:
    n: 8
    max_new_tokens: 48
    non_regression:
      n: 4
      max_new_tokens: 48
  sauvegarder: false
