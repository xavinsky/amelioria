# RAG — poste local (inférence seule) ou API compatible OpenAI
modele:
  nom: Qwen/Qwen2.5-1.5B-Instruct
  api_base: null

recherche:
  methode: hybride                  # bm25 | dense | hybride
  embeddings: sentence-transformers/all-mpnet-base-v2   # BAAI/bge-m3 (multilingue, français), intfloat/multilingual-e5-large...
  reranker: cross-encoder/ms-marco-MiniLM-L-6-v2        # null pour désactiver ; BAAI/bge-reranker-v2-m3 en multilingue
  k: 3                              # passages donnés au modèle
  k_candidats: 20                   # passages récupérés avant reranking

gabarit: |-
  Answer the question using only the context below. If the answer is not in the context, say you don't know.

  Context:
  {contexte}

  Question: {question}
  Answer briefly.

donnees:
  n_entites: 50
  n_distracteurs: 2000              # paragraphes Wikipédia ajoutés au corpus
  n_jumeaux: 50                     # personnages au nom presque identique et aux faits différents, ajoutés au corpus
  n_sans_reponse: 25                # questions sur des personnages absents du corpus (la bonne réponse est un refus)
  graine: 0

evaluation:
  n: 200
  max_new_tokens: 32

quick:
  modele:
    nom: HuggingFaceTB/SmolLM2-135M-Instruct
  recherche:
    methode: bm25
    reranker: null
  donnees:
    n_entites: 5
    n_distracteurs: 20
    n_jumeaux: 5
    n_sans_reponse: 3
  evaluation:
    n: 8
    max_new_tokens: 16
